<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muara Kata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Muara Kata: tempat semua cerita bermuara. Cerita, puisi, esai, ide, dan tulisan ilmiah dalam satu tempat menulis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: masthead + lead story beside a "terbitan jurnal" index, then a mixed feed; article pages use a reading column with a metadata rail. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #14211f;
  --muted: #5a6865;
  --line: #d6dddb;
  --accent: #0f5c55;      /* jurnal / ilmiah */
  --accent-ink: #ffffff;
  --news: #b8760f;        /* berita */
  --news-soft: #f6ead3;
  --accent-soft: #dcebe8;
  --danger: #b3261e;
  --like: #d0364f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --surface: #172120; --ink: #e5ecea; --muted: #9aa9a6; --line: #2a3735;
    --accent: #5cc2b5; --accent-ink: #062521; --news: #e8b04d; --news-soft: #3a2c12; --accent-soft: #163a36;
    --danger: #ff8a80; --like: #ff7088; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --like: #ff7088;
  --bg: #0f1615; --surface: #172120; --ink: #e5ecea; --muted: #9aa9a6; --line: #2a3735;
  --accent: #5cc2b5; --accent-ink: #062521; --news: #e8b04d; --news-soft: #3a2c12; --accent-soft: #163a36;
  --danger: #ff8a80; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  min-height: 100vh; display: flex; flex-direction: column;
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
}
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Masthead ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.masthead { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.masthead .wrap { display: flex; align-items: center; gap: 20px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; margin-right: auto; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; }
.brand-name span { color: var(--accent); }
.brand-tag { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav a { font-family: var(--font-display); font-weight: 500; text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: .95rem; }
.nav a:hover { background: var(--bg); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: .95rem;
  padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--ink); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { color: var(--danger); }
.btn-danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn-sm { padding: 6px 11px; font-size: .85rem; }

/* ---------- Ticker / toolbar ---------- */
.toolbar .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 18px 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: var(--font-display); font-weight: 500; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.search { flex: 1 1 240px; min-width: 0; display: flex; }
.search input { width: 100%; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.today { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

/* ---------- Tags ---------- */
.tag { display: inline-block; font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 3px; font-weight: 500; }
.tag-berita { background: var(--news-soft); color: var(--news); }
.tag-jurnal { background: var(--accent-soft); color: var(--accent); }
.tag-contoh { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.meta { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

/* ---------- Lead ---------- */
.lead { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 32px; padding-block: 18px 34px; }
.lead.solo { grid-template-columns: minmax(0, 1fr); }
.feature { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(22px, 4vw, 44px); display: grid; gap: 28px; text-decoration: none; align-content: start; transition: border-color .15s; }
.feature:hover { border-color: var(--ink); }
.feature .cover { border-radius: 6px; }
.feature-head { display: grid; gap: 14px; align-content: start; }
.feature-label { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.feature h2 { font-family: var(--font-display); font-size: clamp(1.8rem, 3.6vw, 2.8rem); line-height: 1.06; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.feature.is-poem h2 { font-family: var(--font-body); font-weight: 600; letter-spacing: -0.01em; }
.feature-by { font-size: 1rem; color: var(--muted); }
.feature-by strong { color: var(--ink); font-weight: 600; }
.feature.is-poem .feature-by { font-style: italic; }
.feature-cta { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: .95rem; margin-top: 4px; }
.feature:hover .feature-cta { text-decoration: underline; text-underline-offset: 4px; }
.feature-excerpt { margin: 0; color: var(--ink); font-size: 1.08rem; line-height: 1.75; max-width: 62ch; }
.feature-excerpt.verse-excerpt { font-style: italic; line-height: 1.85; border-left: 3px solid var(--accent-soft); padding-left: 22px; align-self: center; }
.feature-excerpt .verse { display: block; padding-left: 1.2em; text-indent: -1.2em; }
.lead.solo .feature { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 56px; align-items: center; }
.lead.solo .feature .cover { grid-column: 1 / -1; }
.invite { display: flex; flex-wrap: wrap; gap: 18px 32px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-block: 32px 56px; }
.invite h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0 0 6px; }
.invite p { margin: 0; color: var(--muted); max-width: 56ch; }
.lead-story { text-decoration: none; display: grid; gap: 14px; }
.lead-story h2 { font-family: var(--font-display); font-size: clamp(1.7rem, 3.4vw, 2.6rem); line-height: 1.08; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead-story:hover h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.lead-story p { margin: 0; color: var(--muted); max-width: 62ch; }
.cover { aspect-ratio: 16 / 9; width: 100%; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--accent-soft); position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover-fallback { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 16px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.8rem); color: var(--accent); letter-spacing: -0.01em;
  background:
    repeating-linear-gradient(135deg, transparent 0 18px, color-mix(in srgb, var(--accent) 10%, transparent) 18px 19px),
    var(--accent-soft); }
.cover-fallback.berita { color: var(--news);
  background:
    repeating-linear-gradient(90deg, transparent 0 22px, color-mix(in srgb, var(--news) 14%, transparent) 22px 23px),
    var(--news-soft); }

.issue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 4px; align-self: start; }
.issue-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 6px; }
.issue-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
.issue-item { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.issue-item:last-child { border-bottom: 0; }
.issue-item strong { font-family: var(--font-display); font-weight: 700; line-height: 1.25; font-size: 1.02rem; }
.issue-item:hover strong { color: var(--accent); }
.issue-item .auth { font-size: .88rem; color: var(--muted); font-style: italic; }

/* ---------- Feed ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
.section-title h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; padding-bottom: 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--ink); transform: translateY(-2px); }
.card .cover { border-radius: 0; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.card h3 { font-family: var(--font-display); font-size: 1.18rem; line-height: 1.22; margin: 0; text-wrap: balance; }
.card p { margin: 0; font-size: .95rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-foot { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
.card.jurnal .card-body { border-top: 4px solid var(--accent); }
.card.jurnal .abs-label { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); grid-column: 1 / -1; }

/* ---------- Article ---------- */
.article { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; padding-block: 28px 64px; }
.article-main { min-width: 0; max-width: 720px; }
.back { font-family: var(--font-display); text-decoration: none; color: var(--muted); font-size: .92rem; display: inline-block; margin-bottom: 18px; }
.back:hover { color: var(--ink); }
.eyebrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.article h1 { font-family: var(--font-display); font-size: clamp(1.9rem, 4.4vw, 3rem); line-height: 1.06; letter-spacing: -0.025em; margin: 0 0 16px; text-wrap: balance; }
.byline { font-size: 1.02rem; margin-bottom: 4px; }
.affil { color: var(--muted); font-size: .92rem; font-style: italic; margin-bottom: 14px; }
.abstract { background: var(--accent-soft); border-radius: var(--radius); padding: 18px 22px; margin: 22px 0; }
.abstract h2 { font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 8px; color: var(--accent); }
.abstract p { margin: 0; font-size: .98rem; }
.kw { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.kw span { font-family: var(--font-mono); font-size: .75rem; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
.prose { font-size: 1.08rem; line-height: 1.75; }
.prose p { margin: 0 0 1.1em; }
.prose h3 { font-family: var(--font-display); font-size: 1.35rem; margin: 1.6em 0 .5em; line-height: 1.2; }
.prose blockquote { margin: 1.4em 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--news); font-style: italic; color: var(--muted); }
.article:not(.poem) .prose > p:first-child::first-letter { font-family: var(--font-display); font-weight: 800; float: left; font-size: 3.4em; line-height: .9; padding: 6px 10px 0 0; color: var(--news); }
.refs { margin-top: 36px; border-top: 2px solid var(--ink); padding-top: 14px; }
.refs h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 10px; }
.refs ol { padding-left: 1.4em; margin: 0; font-size: .93rem; display: grid; gap: 8px; overflow-wrap: anywhere; }
.article-cover { margin: 8px 0 26px; }
.caption { font-size: .82rem; color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }

.rail { display: flex; flex-direction: column; gap: 16px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .85rem; }
.panel dt { color: var(--muted); font-family: var(--font-mono); font-size: .75rem; padding-top: 2px; }
.panel dd { margin: 0; overflow-wrap: anywhere; }
.cite-box { font-size: .85rem; background: var(--bg); border-radius: 4px; padding: 10px; overflow-wrap: anywhere; user-select: all; }
.pdf-frame { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: var(--radius); margin-top: 18px; background: var(--surface); }

/* ---------- Form ---------- */
.form-page { padding-block: 28px 64px; max-width: 860px; margin-inline: auto; }
.form-page h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 6px; letter-spacing: -0.02em; }
.form-page > p { color: var(--muted); margin: 0 0 24px; }
form.submit { display: grid; gap: 22px; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 20px; margin: 0; background: var(--surface); display: grid; gap: 16px; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 700; padding: 0 6px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-family: var(--font-display); font-weight: 500; font-size: .95rem; }
.field .hint { font-size: .8rem; color: var(--muted); font-family: var(--font-mono); }
.field { align-content: start; }
.field input[type="text"], .field input[type="date"], .field input[type="url"], .field input[type="email"], .field input[type="password"], .field select { min-height: 46px; }
.field input[type="text"], .field input[type="date"], .field input[type="url"], .field input[type="email"], .field input[type="password"], .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
.field textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
.field textarea.big { min-height: 280px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 16px; }
.type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-pick label { border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; background: var(--surface); }
.type-pick input { position: absolute; opacity: 0; pointer-events: none; }
.type-pick strong { font-family: var(--font-display); font-size: 1.1rem; }
.type-pick span { font-size: .85rem; color: var(--muted); }
.type-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.type-pick label.berita:has(input:checked) { border-color: var(--news); background: var(--news-soft); }
.type-pick label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; background: var(--bg); min-width: 0; }
.drop input[type="file"] { max-width: 100%; min-width: 0; font-size: .9rem; color: var(--muted); }
.drop input[type="file"]::file-selector-button { font-family: var(--font-display); font-weight: 700; font-size: .88rem; padding: 8px 14px; margin-right: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.drop input[type="file"]::file-selector-button:hover { border-color: var(--ink); }
.drop > label { font-family: var(--font-display); font-weight: 500; }
.drop.over { border-color: var(--accent); }
.drop .preview { max-height: 180px; border-radius: 4px; object-fit: cover; }
.form-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.error { color: var(--danger); font-size: .9rem; }

/* ---------- One kind of writing ---------- */
.tag-cat { background: var(--accent-soft); color: var(--accent); }
.seg.chips { flex-wrap: wrap; border-radius: 18px; max-width: 100%; }
.card.no-cover .card-body { border-top: 4px solid var(--accent); }
.card.no-cover p { -webkit-line-clamp: 5; }
.section-break { text-align: center; color: var(--muted); font-size: 1.25rem; margin: 2.2em 0; user-select: none; }
/* Poem page: one centred column like a page in a poetry book; the poem block is as wide as its longest
   line and centred, while the lines themselves stay left-aligned. Side panels drop below the poem. */
.article.poem { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 40px; }
.article.poem .article-main { width: 100%; max-width: 640px; }
.article.poem .back { display: block; }
.article.poem .eyebrow { justify-content: center; }
.article.poem h1 { font-family: var(--font-body); font-weight: 600; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.15; letter-spacing: -0.01em; text-align: center; margin-bottom: 12px; }
.article.poem .byline, .article.poem .affil, .article.poem .article-main > .meta { text-align: center; }
.article.poem .byline { font-style: italic; }
.article.poem .byline strong { font-weight: 600; }
.article.poem .article-main > .meta::after { content: ""; display: block; width: 48px; height: 1px; background: var(--line); margin: 28px auto 0; }
.article.poem .prose { width: fit-content; max-width: 100%; margin: 36px auto 0; font-size: 1.14rem; line-height: 1.85; }
.article.poem .prose .stanza { margin: 0 0 1.8em; }
.article.poem .prose .stanza:last-child { margin-bottom: 0; }
.article.poem .verse { display: block; padding-left: 1.5em; text-indent: -1.5em; }
.article.poem .section-break { margin: 2.4em 0 2.2em; }
.article.poem .rail { position: static; width: 100%; max-width: 640px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
#drop-pdf { margin-bottom: 4px; }

/* ---------- Like & share ---------- */
.actions { display: flex; gap: 12px; align-items: center; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); }
.article.poem .actions { justify-content: center; max-width: 360px; margin-inline: auto; }
.act { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; min-width: 46px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  font-family: var(--font-mono); font-size: .92rem; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s, color .15s; }
.act:hover { border-color: var(--ink); }
.act:disabled { cursor: progress; }
.act svg { width: 21px; height: 21px; flex: none; }
.act svg path, .act svg circle, .act svg line { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.act-like[aria-pressed="true"] { color: var(--like); border-color: color-mix(in srgb, var(--like) 45%, var(--line)); background: color-mix(in srgb, var(--like) 9%, var(--surface)); }
.act-like[aria-pressed="true"] svg path { fill: currentColor; }
.act-count:empty { display: none; }

<script>
(function () {
  "use strict";

  /* =====================================================================
     Storage. Two modes:
     - "shared": opened as a published claude.ai artifact. Articles live in the
       artifact's shared database; PDFs and covers are uploaded as assets.
       Everyone who opens the link reads; only owner/editors write.
     - "local":  index.html opened directly or hosted statically. Articles live
       in this browser's IndexedDB (with an in-memory fallback).
     - "github": hosted on GitHub Pages with content/articles.json in the repo.
       Everyone reads the static file; the owner signs in with a GitHub token
       and the page commits articles and files to the repo via the GitHub API.
     - "closed": inside the artifact viewer but the shared store is unavailable
       (e.g. signed out). Read-only, nothing to show.
     ===================================================================== */
  const DB_NAME = "tandeallo", STORE = "articles", COLL = "articles";
  let idb = null, memory = [];
  let mode = "local", shared = null, assetsCap = null, dl = null, canWrite = true;
  // Fallback repo for GitHub mode; on <owner>.github.io/<repo> it is read from the address.
  const GH_DEFAULT = { owner: "MuaraKata", repo: "muarakata.github.io" }; // only used off github.io
  const CONTENT = "content/articles.json", FILES_DIR = "content/files/", TOKEN_KEY = "tandeallo-gh-token";
  let gh = null; // { owner, repo, branch, token } once the manager is signed in
  // Public submissions go to a Google Apps Script web app (apps-script/Code.gs); its URL lives in content/config.json.
  const CONFIG = "content/config.json", INBOX_KEY = "tandeallo-inbox-key";
  const INBOX_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/;
  let submitUrl = "";
  async function inbox(payload) {
    let r;
    try {
      // text/plain keeps this a "simple" request, so the browser sends no preflight Apps Script cannot answer.
      r = await fetch(submitUrl, { method: "POST", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" }, cache: "no-store", redirect: "follow" });
    } catch (e) { throw { code: "inbox_net" }; }
    let data = null;
    try { data = await r.json(); } catch (e) { throw { code: "inbox_bad" }; }
    if (!data || !data.ok) throw { code: "inbox_" + ((data && data.error) || "err"), message: data && data.detail };
    return data;
  }
  function inboxErrorText(e) {
    const c = e && e.code;
    if (c === "inbox_kunci") return "Kunci admin salah. Salin lagi kunci dari Log eksekusi fungsi setup di Apps Script.";
    if (c === "inbox_net" || c === "inbox_bad") return "Kotak masuk tidak bisa dihubungi. Periksa koneksi, dan pastikan aplikasi web diterapkan dengan akses \"Siapa saja\".";
    if (c === "inbox_tidak-ada") return "Naskah ini sudah tidak ada di kotak masuk. Muat ulang halaman.";
    if (c === "inbox_server") return "Kotak masuk mengalami galat" + (e.message ? " (" + e.message + ")" : "") + ".";
    if (c && String(c).startsWith("gh_")) return ghErrorText(e);
    return "Permintaan gagal. Coba lagi.";
  }
  let loaded = false, loadSlow = false, loadError = false, loadTimer = null;

  function idbOpen() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: "id" });
        req.onsuccess = () => { idb = req.result; resolve(true); };
        req.onerror = () => resolve(false);
        req.onblocked = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  }
  function tx(m) { return idb.transaction(STORE, m).objectStore(STORE); }
  function idbAll() {
    if (!idb) return Promise.resolve(memory.slice());
    return new Promise((res) => {
      try { const r = tx("readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }
      catch (e) { res(memory.slice()); }
    });
  }
  function idbPut(a) {
    if (!idb) { memory = memory.filter(x => x.id !== a.id).concat(a); return Promise.resolve(); }
    return new Promise((res, rej) => {
      try { const r = tx("readwrite").put(a); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
  }
  function idbDel(id) {
    if (!idb) { memory = memory.filter(x => x.id !== id); return Promise.resolve(); }
    return new Promise((res) => {
      try { const r = tx("readwrite").delete(id); r.onsuccess = () => res(); r.onerror = () => res(); }
      catch (e) { res(); }
    });
  }
  function put(a) {
    if (mode === "shared") return shared.collection(COLL).doc(a.id).set(a);
    if (mode === "github") return ghSaveArticles(list => list.filter(x => x.id !== a.id).concat(a), "Terbitkan artikel: " + a.title);
    return idbPut(a);
  }
  function remove(id) {
    if (mode === "shared") return shared.collection(COLL).doc(id).delete();
    if (mode === "github") return ghSaveArticles(list => list.filter(x => x.id !== id), "Hapus artikel " + id);
    return idbDel(id);
  }
  const remoteFiles = () => mode === "shared" || mode === "github";

  /* ---------- GitHub (Contents API) ---------- */
  function ghRepoFromLocation() {
    const host = location.hostname.toLowerCase();
    if (!host.endsWith(".github.io")) return Object.assign({}, GH_DEFAULT);
    const owner = host.slice(0, -".github.io".length);
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return { owner, repo: seg && !/\.html?$/.test(seg) ? seg : owner + ".github.io" };
  }
  async function ghReq(method, path, body, base) {
    // Large uploads get longer; nothing waits forever on a stalled mobile connection.
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), body && body.content && body.content.length > 2e6 ? 120000 : 25000);
    let r;
    try {
      r = await fetch((base || "https://api.github.com/repos/" + gh.owner + "/" + gh.repo + "/") + path, {
        method, signal: ctl.signal,
        // GitHub marks API responses cacheable for 60 s; a cached file sha makes the next save fail with 409.
        cache: "no-store",
        headers: { Authorization: "Bearer " + gh.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
        body: body ? JSON.stringify(body) : undefined
      });
    } catch (e) { throw { code: "gh_net", message: "" }; }
    finally { clearTimeout(timer); }
    if (!r.ok) {
      let msg = ""; try { msg = (await r.json()).message || ""; } catch (e) {}
      throw { code: "gh_" + r.status, message: msg };
    }
    return r.status === 204 ? null : r.json();
  }
  const encPath = (p) => p.split("/").map(encodeURIComponent).join("/");
  function b64ToText(b64) {
    const bin = atob(String(b64).replace(/\s/g, ""));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }
  function textToB64(text) {
    const bytes = new TextEncoder().encode(text); let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  async function blobToB64(blob) { return (await readFile(blob)).split(",")[1]; }
  async function ghGetFile(path) {
    try { return await ghReq("GET", "contents/" + encPath(path) + "?ref=" + encodeURIComponent(gh.branch)); }
    catch (e) { if (e.code === "gh_404") return null; throw e; }
  }
  async function ghPutFile(path, b64, message) {
    const cur = await ghGetFile(path);
    return ghReq("PUT", "contents/" + encPath(path), { message, content: b64, branch: gh.branch, sha: cur ? cur.sha : undefined });
  }
  async function ghDeleteFile(path) {
    if (!path || !path.startsWith(FILES_DIR)) return;
    try { const cur = await ghGetFile(path); if (cur) await ghReq("DELETE", "contents/" + encPath(path), { message: "Hapus berkas " + path, sha: cur.sha, branch: gh.branch }); } catch (e) {}
  }
  async function ghReadArticles() {
    const meta = await ghGetFile(CONTENT);
    if (!meta) return { list: [], sha: undefined };
    let text = meta.content ? b64ToText(meta.content) : "";
    if (!text) { // over 1 MB: the API leaves content empty; read the blob instead
      const blob = await ghReq("GET", "git/blobs/" + meta.sha);
      text = b64ToText(blob.content);
    }
    const data = JSON.parse(text || "{}");
    return { list: Array.isArray(data) ? data : (data.articles || []), sha: meta.sha };
  }
  async function ghSaveArticles(mutate, message) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const { list, sha } = await ghReadArticles();
      const next = mutate(list.slice());
      const body = JSON.stringify({ app: "tandeallo", version: 1, updated: new Date().toISOString(), articles: next }, null, 2) + "\n";
      try {
        await ghReq("PUT", "contents/" + encPath(CONTENT), { message, content: textToB64(body), branch: gh.branch, sha });
        articles = next; return;
      } catch (e) { if (e.code !== "gh_409" || attempt) throw e; }
    }
  }
  let ghNetFail = false;  // last sign-in failed for lack of network, not because GitHub refused
  let signingIn = null;   // pending background sign-in with a remembered token
  async function ghSignIn(token) {
    ghNetFail = false;
    const where = ghRepoFromLocation();
    gh = Object.assign(where, { token, branch: "" });
    try {
      const repo = await ghReq("GET", "", null, "https://api.github.com/repos/" + where.owner + "/" + where.repo);
      if (!repo.permissions || !repo.permissions.push) { gh = null; return "Token ini tidak punya izin menulis ke repositori " + where.owner + "/" + where.repo + "."; }
      // Write to the branch GitHub Pages serves: "main" when it exists, else the default branch.
      gh.branch = repo.default_branch;
      try { await ghReq("GET", "branches/main"); gh.branch = "main"; } catch (e) {}
      articles = (await ghReadArticles()).list;
      const denied = await ghProbeWrite();
      if (denied) { gh = null; ghNetFail = /tidak bisa dihubungi/.test(denied); return denied; }
      canWrite = true;
      return "";
    } catch (e) {
      gh = null;
      if (e && (e.code === "gh_401" || e.code === "gh_403")) return ghErrorText(e);
      if (e && e.code === "gh_404") return "Repositori " + where.owner + "/" + where.repo + " tidak ditemukan dengan token ini. Pastikan token diberi akses ke repositori tersebut.";
      ghNetFail = true;
      return "Tidak dapat menghubungi GitHub. Periksa koneksi lalu coba lagi.";
    }
  }
  // Checks that the TOKEN (not just the account) may write repo contents, without changing anything:
  // re-sends articles.json unchanged with a deliberately wrong sha. GitHub checks permission first,
  // so a token without write access gets 403/404, while one with access gets 409/422 and nothing is written.
  async function ghProbeWrite() {
    const meta = await ghGetFile(CONTENT);
    if (!meta || !meta.content) return "";
    try {
      await ghReq("PUT", "contents/" + encPath(CONTENT), { message: "Periksa izin token", content: meta.content.replace(/\s/g, ""), branch: gh.branch, sha: "0000000000000000000000000000000000000000" });
      return "";
    } catch (e) {
      if (e && (e.code === "gh_401" || e.code === "gh_403" || e.code === "gh_404")) return ghErrorText(e);
      return "";
    }
  }
  function ghErrorText(e) {
    const code = e && e.code, msg = (e && e.message) || "";
    const raw = msg ? " (Pesan GitHub: \"" + msg + "\")" : "";
    if (code === "gh_net") return "GitHub tidak bisa dihubungi atau terlalu lama menjawab. Periksa koneksi internet lalu coba lagi.";
    if (code === "gh_401") return "Token tidak valid atau sudah kedaluwarsa. Buat token baru, lalu Keluar dan masuk lagi." + raw;
    if (/approv|forbids access via a fine-grained|organization/i.test(msg)) return "Organisasi pemilik repositori belum menyetujui token ini. Setujui di Settings organisasi → Personal access tokens → Pending requests, atau buat token dengan Resource owner yang benar." + raw;
    if (code === "gh_403" || code === "gh_404") return "Token ini hanya bisa membaca, belum bisa mengubah isi repositori. Buat token baru dengan Repository access ke " + (gh ? gh.repo : "repositori ini") + " dan Permissions → Contents: Read and write, lalu Keluar dan masuk lagi." + raw;
    if (code === "gh_409" || code === "gh_422") return "GitHub menolak perubahan karena repositori baru saja berubah. Muat ulang halaman lalu coba lagi." + raw;
    return "GitHub menolak permintaan." + raw;
  }
  async function dropAsset(id) {
    if (!id || !assetsCap) return;
    try { await assetsCap.delete(id); } catch (e) {}
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ================= Sample content (local mode only, marked as examples) ================= */
  const SAMPLES = [
    {
      id: "contoh-1", type: "berita", contoh: true, rubrik: "Lingkungan",
      title: "Mangrove Pesisir Selatan Pulih, Nelayan Kepiting Kembali Panen",
      authors: "Redaksi Muara Kata", date: "2026-11-10",
      abstract: "Lima tahun setelah penanaman ulang, hutan mangrove di pesisir selatan kembali rapat. Hasil tangkapan kepiting bakau nelayan setempat naik hampir dua kali lipat.",
      body: "Pagi itu air sedang surut. Di sela akar-akar bakau yang mencuat dari lumpur, Daeng Rahman memeriksa satu per satu bubu yang ia pasang semalam. Hampir semuanya berisi.\n\n\"Dulu kami harus ke pulau seberang untuk dapat kepiting. Sekarang cukup di sini,\" katanya.\n\n## Lima tahun penanaman\n\nPenanaman ulang dimulai pada 2021 oleh kelompok tani hutan setempat bersama pemerintah desa. Sekitar 40.000 bibit *Rhizophora* ditanam di lahan bekas tambak yang ditinggalkan.\n\n> Kuncinya bukan menanam sebanyak-banyaknya, tetapi memastikan aliran pasang surut kembali normal.\n\nKelompok tani kini merencanakan ekowisata kecil berupa jalur papan di tepi hutan, dengan pemandu dari warga desa sendiri."
    },
    {
      id: "contoh-2", type: "jurnal", contoh: true, rubrik: "Ilmu Lingkungan",
      title: "Pengaruh Restorasi Mangrove terhadap Kelimpahan Kepiting Bakau (Scylla serrata) di Pesisir Sulawesi Selatan",
      authors: "Andi Nurhaliza; Muh. Fajar Saputra; Rina Tandiarrang",
      affiliation: "Program Studi Ilmu Kelautan, Universitas Hasanuddin",
      date: "2026-10-28", volume: "4", issue: "2", pages: "101–118", doi: "10.00000/tdl.v4i2.112",
      keywords: "mangrove; restorasi; Scylla serrata; perikanan skala kecil",
      abstract: "Penelitian ini membandingkan kelimpahan kepiting bakau pada kawasan mangrove hasil restorasi berumur lima tahun dengan kawasan alami dan bekas tambak. Pengambilan sampel dilakukan dengan bubu lipat pada 18 stasiun selama enam bulan. Kelimpahan pada kawasan restorasi mencapai 82% dari kawasan alami dan berbeda nyata dengan bekas tambak (p < 0,05). Hasil ini menunjukkan restorasi berbasis hidrologi dapat memulihkan fungsi habitat dalam waktu relatif singkat.",
      body: "## Pendahuluan\n\nHutan mangrove merupakan habitat penting bagi kepiting bakau pada seluruh tahap hidupnya. Konversi mangrove menjadi tambak selama tiga dekade terakhir telah menurunkan produksi kepiting di banyak wilayah pesisir.\n\n## Metode\n\nPenelitian dilakukan pada Januari–Juni 2026 di tiga tipe lahan: mangrove alami, mangrove restorasi, dan bekas tambak. Setiap tipe lahan terdiri atas enam stasiun dengan sepuluh bubu lipat per stasiun.\n\n## Hasil dan Pembahasan\n\nRata-rata hasil tangkapan per unit upaya pada kawasan restorasi sebesar 3,1 ekor/bubu/malam, dibandingkan 3,8 pada kawasan alami dan 0,9 pada bekas tambak.\n\n## Kesimpulan\n\nRestorasi mangrove yang memulihkan aliran pasang surut efektif mengembalikan kelimpahan kepiting bakau.",
      references: "Alongi, D. M. (2014). Carbon cycling and storage in mangrove forests. Annual Review of Marine Science, 6, 195–219.\nLewis, R. R. (2005). Ecological engineering for successful management and restoration of mangrove forests. Ecological Engineering, 24(4), 403–418."
    },
    {
      id: "contoh-3", type: "berita", contoh: true, rubrik: "Kampus",
      title: "Seminar Nasional Literasi Data Digelar, 300 Peserta Ikut Daring",
      authors: "Tim Liputan", date: "2026-11-06",
      abstract: "Seminar membahas cara peneliti muda membagikan data penelitian secara terbuka tanpa melanggar privasi responden.",
      body: "Seminar nasional bertema literasi data penelitian berlangsung secara hibrida dan diikuti lebih dari 300 peserta dari berbagai kampus.\n\nPembicara menekankan pentingnya anonimisasi data sebelum diunggah ke repositori terbuka."
    },
    {
      id: "contoh-4", type: "jurnal", contoh: true, rubrik: "Pendidikan",
      title: "Pemanfaatan Bahasa Daerah dalam Pembelajaran Matematika Kelas Awal",
      authors: "Yohanis Patandianan; Sri Wahyuni",
      affiliation: "Fakultas Keguruan dan Ilmu Pendidikan, Universitas Kristen Indonesia Toraja",
      date: "2026-10-15", volume: "4", issue: "2", pages: "119–134",
      keywords: "bahasa ibu; matematika; sekolah dasar",
      abstract: "Studi kuasi-eksperimen pada 64 siswa kelas II menunjukkan penggunaan bahasa daerah sebagai pengantar meningkatkan pemahaman konsep bilangan secara signifikan dibanding kelas kontrol.",
      body: "## Pendahuluan\n\nBanyak siswa kelas awal di daerah belum fasih berbahasa Indonesia ketika masuk sekolah.\n\n## Hasil\n\nRata-rata skor pascates kelompok eksperimen 78,4 dibanding 69,1 pada kelompok kontrol.",
      references: "UNESCO. (2016). If you don't understand, how can you learn? Global Education Monitoring Report Policy Paper 24."
    }
  ];

  /* ================= Helpers ================= */
  const $ = (s, el = document) => el.querySelector(s);
  const app = $("#app");
  let articles = [];
  let view = { filter: "", query: "", leadId: "" };
  let pdfUrl = null, lastArticleJSON = "";
  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const assetUrl = (id) => /^[0-9a-f]{32}$/.test(id || "") ? "/_blob/" + id : "";
  function fmtDate(d) {
    if (!d) return "";
    const dt = new Date(d + (d.length === 10 ? "T00:00:00" : ""));
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  }
  const year = (d) => (d || "").slice(0, 4) || "t.t.";
  const splitList = (s) => String(s || "").split(/[;\n]/).map(x => x.trim()).filter(Boolean);
  function authorLine(a) {
    const list = splitList(a.authors);

  function dataUrlToBlob(dataUrl) {

  function readFile(file) {

  }
  function resizeCanvas(file, max) {
    return readFile(file).then(src => new Promise((res) => {

        const scale = Math.min(1, max / img.width);
        const c = document.createElement("canvas");

  }

  /* ---------- PDF -> web text (PDF.js from cdnjs, loaded only when a PDF is opened) ---------- */
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfjsReady = null;
  function loadPdfJs() {
    if (pdfjsReady) return pdfjsReady;
    pdfjsReady = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = PDFJS + "pdf.min.js";
      s.onload = () => {
        const lib = window.pdfjsLib;
        if (!lib) { pdfjsReady = null; return reject({ code: "pdf_lib" }); }
        try {
          // A same-origin blob worker that imports the CDN worker works on GitHub Pages and in sandboxed viewers.
          const boot = new Blob(['importScripts("' + PDFJS + 'pdf.worker.min.js");'], { type: "text/javascript" });
          lib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(boot));
        } catch (e) { lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; }
        resolve(lib);

  const median = (arr) => { if (!arr.length) return 0; const a = arr.slice().sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; };
  // Turns a PDF into this site's writing markup: paragraphs separated by blank lines, "## " headings.
  async function pdfToText(bytes, opts) {
    const lib = await loadPdfJs();
    let doc;
    try { doc = await lib.getDocument({ data: bytes }).promise; }
    catch (e) { throw { code: e && e.name === "PasswordException" ? "pdf_locked" : "pdf_bad" }; }
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const tc = await (await doc.getPage(i)).getTextContent();
      const lines = []; let cur = null, lastEnd = null;
      for (const it of tc.items) {
        if (typeof it.str !== "string") continue;
        const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 0;
        if (it.str.trim()) {
          if (!cur || Math.abs(y - cur.y) > Math.max(2, h * 0.5)) { cur = { y, h, text: "" }; lines.push(cur); lastEnd = null; }
          if (cur.text && lastEnd !== null && x - lastEnd > h * 0.15 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += " ";
          cur.text += it.str; cur.h = Math.max(cur.h, h);
          lastEnd = x + (it.width || 0);
        } else if (cur && it.str) { cur.text += " "; }
        if (it.hasEOL) cur = null;
      }
      pages.push(lines.map(l => ({ y: l.y, h: l.h, text: l.text.replace(/\s+/g, " ").trim() })).filter(l => l.text));
    }
    const all = pages.flat();
    const chars = all.reduce((n, l) => n + l.text.length, 0);
    if (chars < 30 * doc.numPages) throw { code: "pdf_scan" };

    // Running headers/footers and page numbers live at the top or bottom edge of a page; body text that
    // happens to repeat (a refrain, a stock phrase) is left alone.
    const keyOf = (t) => t.toLowerCase().replace(/\d+/g, "#");
    const edges = pages.map(ls => { const byY = ls.slice().sort((a, b) => b.y - a.y); return new Set(byY.slice(0, 2).concat(byY.slice(-2))); });
    const seen = {};
    pages.forEach((ls, i) => new Set(ls.filter(l => edges[i].has(l)).map(l => keyOf(l.text))).forEach(k => { seen[k] = (seen[k] || 0) + 1; }));
    const pageNo = (t) => /^[-–\s]*(hal(aman)?\.?\s*)?\d{1,4}[-–\s]*$/i.test(t);
    const furniture = (l, i) => edges[i].has(l) && l.text.length < 120 &&
      (pageNo(l.text) || (doc.numPages >= 3 && seen[keyOf(l.text)] >= Math.ceil(doc.numPages * 0.6)));

    const bodyH = median(all.filter(l => l.text.length > 30).map(l => l.h)) || median(all.map(l => l.h)) || 10;
    const out = []; let para = null;
    const flush = () => { if (para) out.push(para); para = null; };
    // Poems keep every line break: when the writer chose a poem category, or the lines are short like verse.
    const keepLines = !!(opts && opts.keepLines) || (all.length >= 4 && median(all.filter(l => l.h <= bodyH * 1.18).map(l => l.text.length)) < 40);

    pages.forEach((ls, pi) => {
      const lines = ls.filter(l => !furniture(l, pi));
      const gaps = []; for (let k = 1; k < lines.length; k++) { const g = lines[k - 1].y - lines[k].y; if (g > 0 && g < bodyH * 3) gaps.push(g); }
      const lineGap = median(gaps) || bodyH * 1.2;
      let prev = null;
      for (const l of lines) {
        const heading = l.h > bodyH * 1.18 && l.text.length <= 140;
        if (heading) {
          if (para && para.heading && prev && prev.y - l.y > 0 && prev.y - l.y < l.h * 1.8) para.text += " " + l.text;
          else { flush(); para = { heading: true, text: l.text }; }
          prev = l; continue;
        }
        const gap = prev ? prev.y - l.y : null;
        const ended = para && /[.!?:"”’)]$/.test(para.text);
        const fresh = !para || para.heading ||
          (gap !== null && gap > lineGap * 1.45) ||
          (gap !== null && gap < -lineGap * 0.5 && ended) ||
          (prev === null && ended);
        if (fresh) { flush(); para = { heading: false, text: l.text }; }
        else para.text = join(para.text, l.text);
        prev = l;
      }
    });

    let title = "";
    if (out.length > 1 && out[0].heading && (pages[0] || []).some(l => out[0].text.startsWith(l.text))) title = out.shift().text;

          '<button class="act" type="button" id="btn-share" aria-label="Bagikan" title="Bagikan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></button>' +

        (canWrite ? '<div class="panel"><h3>Kelola</h3>' +

    // Older entries stored only a PDF: show its text as a web page.
    if (legacyPdf) (async () => {
      const prose = $("#prose");
      try {
        let bytes;
        if (a.pdf) bytes = new Uint8Array(await dataUrlToBlob(a.pdf).arrayBuffer());
        else bytes = new Uint8Array(await (await fetch(a.pdfId ? assetUrl(a.pdfId) : repoFile(a.pdfPath))).arrayBuffer());
        const r = await pdfToText(bytes);
        if (prose.isConnected) prose.innerHTML = renderBody(r.text);
      } catch (e) { if (prose.isConnected) prose.innerHTML = '<p class="meta">Isi tulisan ini belum bisa ditampilkan. ' + esc(pdfErrorText(e)) + "</p>"; }
    })();

    const del = $("#btn-del");
    if (del) {
      const box = $("#del-confirm"), yes = $("#btn-del-yes"), no = $("#btn-del-no"), derr = $("#del-error");
      del.addEventListener("click", () => { del.hidden = true; box.hidden = false; derr.hidden = true; yes.focus(); });
      no.addEventListener("click", () => { box.hidden = true; del.hidden = false; });
      yes.addEventListener("click", async () => {
        yes.disabled = true; no.disabled = true; yes.textContent = "Menghapus…";
        try {
          await remove(a.id);
          articles = articles.filter(x => x.id !== a.id);
          if (mode === "shared") { await dropAsset(a.coverId); await dropAsset(a.pdfId); }
          if (mode === "github") { await ghDeleteFile(a.coverPath); await ghDeleteFile(a.pdfPath); }
          toast(mode === "github" ? "Tulisan dihapus. Pengunjung melihat perubahannya dalam 1–2 menit." : "Tulisan dihapus");
          location.hash = "";

  /* ---------- Like & share ----------
     Likes are counted by the same Apps Script web app that receives submissions (actions "like" and
     "likes"). Each browser remembers which pieces it liked, so a reader can like once and take it back.
     If the script is older and doesn't know these actions, or the site has no inbox, liking still
     works for that reader but no shared count is shown. */
  const LIKED_KEY = "muarakata-liked";
  function likedIds() { try { return new Set(JSON.parse(localStorage.getItem(LIKED_KEY) || "[]")); } catch (e) { return new Set(); } }
  function setLiked(id, on) { const s = likedIds(); if (on) s.add(id); else s.delete(id); lsSet(LIKED_KEY, JSON.stringify([...s])); }
  const likeCounts = {};
  const shareUrl = (a) => location.href.split("#")[0] + "#artikel-" + encodeURIComponent(a.id);

  function wireActions(a) {
    const btn = $("#btn-like"), countEl = $("#like-count"), live = $("#act-live"), share = $("#btn-share");
    if (!btn) return;
    const online = () => mode === "github" && !!submitUrl;
    const paint = () => {
      const on = likedIds().has(a.id);
      btn.setAttribute("aria-pressed", String(on));
      btn.setAttribute("aria-label", on ? "Batal suka" : "Suka");
      btn.title = on ? "Batal suka" : "Suka";
      const n = likeCounts[a.id];
      countEl.textContent = typeof n === "number" && n > 0 ? n.toLocaleString("id-ID") : "";
    };
    paint();
    if (online() && typeof likeCounts[a.id] !== "number") {
      inbox({ action: "likes", ids: [a.id] })
        .then(r => { likeCounts[a.id] = Number((r.likes || {})[a.id]) || 0; if (btn.isConnected) paint(); })
        .catch(() => {});
    }
    btn.addEventListener("click", async () => {
      const on = !likedIds().has(a.id);
      setLiked(a.id, on);
      if (typeof likeCounts[a.id] === "number") likeCounts[a.id] = Math.max(0, likeCounts[a.id] + (on ? 1 : -1));
      paint();
      btn.classList.remove("pop"); if (on) { void btn.offsetWidth; btn.classList.add("pop"); }
      live.textContent = on ? "Anda menyukai tulisan ini" : "Suka dibatalkan";
      if (!online()) return;
      btn.disabled = true;
      try {
        const r = await inbox({ action: "like", id: a.id, undo: !on });
        if (typeof r.likes === "number") likeCounts[a.id] = r.likes;
      } catch (e) { /* the reader's own like still stands in this browser */ }
      btn.disabled = false;
      if (btn.isConnected) paint();
    });
    share.addEventListener("click", async () => {
      const url = shareUrl(a);
      const data = { title: a.title, text: a.title + " oleh " + authorLine(a) + " · Muara Kata", url };
      if (navigator.share) {
        try { await navigator.share(data); return; }
        catch (e) { if (e && e.name === "AbortError") return; /* refused here: fall back to copying */ }
      }
      try { await navigator.clipboard.writeText(url); toast("Tautan disalin. Tempel untuk membagikan."); }
      catch (e) { toast("Salin tautan ini: " + url); }
    });
  }

  const DEFAULT_CATS = ["Cerpen", "Puisi", "Esai", "Opini", "Ide & Gagasan", "Catatan Perjalanan", "Artikel Ilmiah", "Berita"];

  function renderForm(editId, opts) {

    if (!sub && signingIn) { app.innerHTML = '<div class="wrap" style="padding-block:48px"><div class="empty">Memeriksa akses pengelola…</div></div>'; return; }
    if (!sub && !canWrite) { toast("Hanya pengelola yang dapat menerbitkan tulisan"); location.hash = ""; return; }
    setNav(sub ? "naskah" : "kirim");

    const v = (k) => esc(d[k] || "");
    const previewSrc = draft.cover || assetUrl(draft.coverId) || repoFile(draft.coverPath);
    const cats = [...new Set(DEFAULT_CATS.concat(articles.map(x => x.rubrik).filter(Boolean)))];
    const extrasOpen = d.affiliation || d.keywords || d.references;

    app.innerHTML =
      '<div class="wrap"><div class="form-page">' +
      "<h1>" + (sub ? "Kirim tulisan" : a ? "Ubah tulisan" : "Tulis") + "</h1>" +
      "<p>" + (sub
        ? "Kirim cerita, puisi, esai, ide, atau tulisan ilmiah Anda ke redaksi Muara Kata. Setiap tulisan ditinjau dulu dan baru tampil setelah diterima. Kami menghubungi Anda lewat email."
        : "Cerita, puisi, esai, ide, atau tulisan ilmiah, semuanya di satu tempat." +
          (mode === "github" ? " Tulisan disimpan ke repositori GitHub dan terlihat oleh semua pengunjung sekitar 1–2 menit setelah terbit." : "") +
          (mode === "shared" ? " Tulisan yang diterbitkan langsung terlihat oleh semua pengunjung." : "")) + "</p>" +
      '<form class="submit" id="f" novalidate>' +
        "<fieldset><legend>Identitas tulisan</legend>" +
          '<div class="field"><label for="title">Judul *</label><input type="text" id="title" name="title" required value="' + v("title") + '"></div>' +
          '<div class="grid-2">' +
            '<div class="field"><label for="authors">Penulis *</label><input type="text" id="authors" name="authors" required value="' + v("authors") + '"><span class="hint">Pisahkan beberapa penulis dengan titik koma (;)</span></div>' +
            '<div class="field"><label for="rubrik">Kategori</label><input type="text" id="rubrik" name="rubrik" list="rubrik-list" placeholder="mis. Cerpen, Puisi, Esai" value="' + v("rubrik") + '"><datalist id="rubrik-list">' +
              cats.map(r => '<option value="' + esc(r) + '">').join("") + "</datalist></div>" +
          "</div>" +
          (sub ? "" : '<div class="grid-2"><div class="field"><label for="date">Tanggal terbit</label><input type="date" id="date" name="date" value="' + v("date") + '"></div></div>') +
        "</fieldset>" +
        "<fieldset><legend>Isi</legend>" +
          '<div class="drop" id="drop-pdf"><label for="pdf">Punya tulisan dalam PDF? Ambil isinya otomatis</label>' +
            '<input type="file" id="pdf" accept="application/pdf,.pdf">' +
            '<span class="meta" id="pdf-status">Teks dari PDF dimasukkan ke kolom Isi tulisan di bawah, lalu tampil sebagai halaman web, bukan sebagai berkas PDF. Anda bisa merapikannya dulu. Untuk puisi, isi kategori "Puisi" lebih dulu supaya setiap baris tetap terjaga.</span>' +
            '<button type="button" class="btn btn-sm" id="pdf-undo" hidden>Kembalikan isi sebelumnya</button></div>' +

          '<div class="field"><label for="abstract">Ringkasan</label><textarea id="abstract" name="abstract" style="min-height:80px">' + v("abstract") + '</textarea><span class="hint">Opsional. Satu-dua kalimat yang tampil di daftar tulisan</span></div>' +
          "<details" + (extrasOpen ? " open" : "") + '><summary style="cursor:pointer;font-family:var(--font-display);font-weight:500">Bagian tambahan untuk tulisan ilmiah (opsional)</summary><div style="display:grid;gap:16px;margin-top:14px">' +
            '<div class="field"><label for="affiliation">Asal / afiliasi penulis</label><input type="text" id="affiliation" name="affiliation" value="' + v("affiliation") + '"></div>' +
            '<div class="field"><label for="keywords">Kata kunci</label><input type="text" id="keywords" name="keywords" placeholder="kata kunci 1; kata kunci 2" value="' + v("keywords") + '"></div>' +
            '<div class="field"><label for="references">Daftar pustaka</label><textarea id="references" name="references">' + v("references") + '</textarea><span class="hint">Satu rujukan per baris</span></div>' +
          "</div></details>" +
        "</fieldset>" +
        "<fieldset><legend>Gambar sampul</legend>" +
          '<div class="drop" id="drop-cover"><label for="cover">Gambar sampul (opsional, JPG/PNG)</label><input type="file" id="cover" accept="image/*"><img class="preview" id="cover-preview" alt="Pratinjau sampul"' + (previewSrc ? ' src="' + esc(previewSrc) + '"' : " hidden") + '><button type="button" class="btn btn-sm" id="cover-clear"' + (previewSrc ? "" : " hidden") + ">Hapus gambar</button></div>" +
        "</fieldset>" +
        (sub ? "<fieldset><legend>Kontak pengirim</legend>" +
          '<div class="grid-2">' +
            '<div class="field"><label for="sender">Nama pengirim</label><input type="text" id="sender" name="sender" autocomplete="name"></div>' +
            '<div class="field"><label for="email">Email *</label><input type="email" id="email" name="email" required autocomplete="email"><span class="hint">Tidak ditampilkan di website</span></div>' +
          "</div>" +
          '<label style="display:flex;gap:10px;align-items:flex-start;font-size:.95rem"><input type="checkbox" id="agree" name="agree" style="margin-top:5px"> <span>Saya menyatakan tulisan ini karya asli, belum pernah diterbitkan di tempat lain, dan saya berhak mengirimkannya untuk diterbitkan.</span></label>' +
          '<div class="trap" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>' +
        "</fieldset>" : "") +
        '<p class="error" id="form-error" hidden></p>' +
        '<div class="form-actions"><button class="btn btn-primary" type="submit" id="btn-submit">' + (sub ? "Kirim tulisan" : a ? "Simpan perubahan" : "Terbitkan") + '</button><a class="btn" href="' + (a ? "#artikel-" + esc(a.id) : "#") + '">Batal</a></div>' +
      "</form></div></div>";

    const form = $("#f");

    // ---- PDF -> text ----
    let beforePdf = null;
    async function takePdf(file) {
      if (!file) return;
      const status = $("#pdf-status"), undo = $("#pdf-undo");
      if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { status.textContent = "Berkas harus berformat PDF."; return; }
      if (file.size > 40 * 1024 * 1024) { status.textContent = "PDF terlalu besar (maks. 40 MB)."; return; }
      status.textContent = "Membaca " + file.name + "…";
      try {
        const r = await pdfToText(new Uint8Array(await file.arrayBuffer()), { keepLines: isPoem({ rubrik: form.rubrik.value }) });
        beforePdf = { body: form.body.value, title: form.title.value };
        form.body.value = r.text;
        if (!form.title.value.trim() && r.title) form.title.value = r.title;
        status.textContent = "Selesai: " + r.pages + " halaman dibaca dari " + file.name + ". Periksa dan rapikan isinya di bawah sebelum " + (sub ? "mengirim" : "menerbitkan") + ".";
        undo.hidden = false;
        if (sub && r.text.length > 190000) status.textContent += " Tulisan ini sangat panjang; bagian setelah 190.000 karakter bisa terpotong.";
      } catch (e) { status.textContent = pdfErrorText(e); }
      $("#pdf").value = "";
    }
    $("#pdf").addEventListener("change", e => takePdf(e.target.files[0]));
    $("#pdf-undo").addEventListener("click", () => {
      if (!beforePdf) return;
      form.body.value = beforePdf.body; form.title.value = beforePdf.title; beforePdf = null;
      $("#pdf-undo").hidden = true; $("#pdf-status").textContent = "Isi sebelumnya dikembalikan.";
    });

    // ---- cover ----
    async function setCover(file) {
      if (!file || !file.type.startsWith("image/")) return;
      const p = $("#cover-preview");
      if (remoteFiles()) { draft.coverBlob = await resizeToBlob(file); draft.cover = ""; p.src = URL.createObjectURL(draft.coverBlob); }
      else { draft.cover = await resizeToDataUrl(file); p.src = draft.cover; }
      p.hidden = false; $("#cover-clear").hidden = false;
    }
    $("#cover").addEventListener("change", e => setCover(e.target.files[0]));
    $("#cover-clear").addEventListener("click", () => { draft.cover = ""; draft.coverId = ""; draft.coverPath = ""; draft.coverBlob = null; $("#cover-preview").hidden = true; $("#cover-clear").hidden = true; $("#cover").value = ""; });
    [["#drop-cover", setCover], ["#drop-pdf", takePdf]].forEach(([sel, fn]) => {
      const z = $(sel);
      z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
      z.addEventListener("dragleave", () => z.classList.remove("over"));
      z.addEventListener("drop", e => { e.preventDefault(); z.classList.remove("over"); if (e.dataTransfer.files[0]) fn(e.dataTransfer.files[0]); });
    });

    async function sendSubmission(get, showErr) {
      const btn = $("#btn-submit");
      btn.disabled = true; btn.textContent = "Mengirim…";
      try {
        await inbox({
          action: "submit", website: get("website"), name: get("sender"), email: get("email"),
          article: {
            type: "tulisan", title: get("title"), authors: get("authors"), rubrik: get("rubrik"),
            affiliation: get("affiliation"), abstract: get("abstract"), body: get("body"),
            references: get("references"), keywords: get("keywords")
          },
          pdfName: "", pdf: "",
          cover: draft.coverBlob ? await blobToB64(draft.coverBlob) : ""
        });
        app.innerHTML = '<div class="wrap"><div class="form-page"><h1>Tulisan terkirim</h1>' +
          "<p>Terima kasih. Redaksi akan meninjau <strong>" + esc(get("title")) + "</strong> dan menghubungi Anda di <strong>" + esc(get("email")) + "</strong>. Tulisan tampil di website setelah diterima.</p>" +
          '<div class="form-actions"><a class="btn btn-primary" href="#">Kembali ke beranda</a><a class="btn" href="#kirim-naskah">Kirim tulisan lain</a></div></div></div>';
        // Leave #kirim-naskah so the menu link and "Kirim tulisan lain" open a fresh form.
        history.replaceState(null, "", location.pathname + location.search + "#terkirim");
        window.scrollTo(0, 0);
      } catch (ex) {
        btn.disabled = false; btn.textContent = "Kirim tulisan";
        const c = ex && ex.code;
        showErr(c === "inbox_data" ? "Periksa kembali judul, penulis, isi, dan email Anda." :
          c === "inbox_berkas" ? "Gambar sampul tidak bisa diterima. Coba gambar lain (JPG/PNG)." :
          c === "inbox_net" || c === "inbox_bad" ? "Tulisan gagal dikirim. Periksa koneksi internet lalu coba lagi." :
          "Tulisan gagal dikirim. Coba lagi beberapa saat lagi.");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const get = (k) => String(fd.get(k) || "").trim();
      const err = $("#form-error");
      const showErr = (m) => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "center" }); };
      const missing = [];
      if (!get("title")) missing.push("judul");
      if (!get("authors")) missing.push("penulis");
      if (!get("body")) missing.push("isi tulisan (ketik langsung atau ambil dari PDF)");
      if (sub && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(get("email"))) missing.push("email yang valid");
      if (sub && !form.agree.checked) missing.push("centang pernyataan keaslian tulisan");
      if (missing.length) { showErr("Lengkapi dulu: " + missing.join(", ") + "."); return; }
      err.hidden = true;
      if (sub) { await sendSubmission(get, showErr); return; }

      const btn = $("#btn-submit"); const label = btn.textContent;
      btn.disabled = true; btn.textContent = "Menyimpan…";
      try {
        const newId = a ? a.id : uid();
        if (mode === "shared" && draft.coverBlob) {
          if (!assetsCap) throw { code: "no_assets" };
          btn.textContent = "Mengunggah gambar…";
          draft.coverId = (await assetsCap.upload(draft.coverBlob, { type: "image/jpeg" })).id; draft.coverBlob = null;
        }
        if (mode === "github" && draft.coverBlob) {
          btn.textContent = "Mengunggah gambar…";
          const path = FILES_DIR + newId + "-" + Date.now().toString(36) + "-sampul.jpg";
          await ghPutFile(path, await blobToB64(draft.coverBlob), "Unggah sampul " + newId);
          draft.coverPath = path; draft.coverBlob = null;
        }
        btn.textContent = "Menyimpan…";
        // Start from the old record so fields the form no longer shows (volume, DOI, legacy PDF) survive an edit.
        const rec = Object.assign({}, a || {}, {
          id: newId, created: a ? a.created || Date.now() : Date.now(), contoh: false, type: "tulisan",
          title: get("title"), authors: get("authors"), rubrik: get("rubrik"),
          date: get("date") || (a && a.date) || new Date().toISOString().slice(0, 10),
          abstract: get("abstract"), body: get("body"),
          affiliation: get("affiliation"), keywords: get("keywords"), references: get("references")
        });
        // The body now holds the text, so a legacy PDF copy is no longer needed.
        const oldPdf = { id: rec.pdfId, path: rec.pdfPath };
        delete rec.pdf; delete rec.pdfId; delete rec.pdfPath; delete rec.pdfName;
        if (mode === "shared") { rec.coverId = draft.coverId; delete rec.cover; delete rec.coverPath; }
        else if (mode === "github") { rec.coverPath = draft.coverPath; delete rec.cover; delete rec.coverId; }
        else { rec.cover = draft.cover; delete rec.coverId; delete rec.coverPath; }
        await put(rec);
        articles = articles.filter(x => x.id !== rec.id).concat(rec);
        if (mode === "shared") {
          if (a && a.coverId && a.coverId !== rec.coverId) await dropAsset(a.coverId);
          if (oldPdf.id) await dropAsset(oldPdf.id);
        }
        if (mode === "github") {
          if (a && a.coverPath && a.coverPath !== rec.coverPath) await ghDeleteFile(a.coverPath);
          if (oldPdf.path) await ghDeleteFile(oldPdf.path);
        }
        toast(mode === "github" ? "Tersimpan di GitHub. Pengunjung melihatnya dalam 1–2 menit." : (a ? "Perubahan disimpan" : "Tulisan diterbitkan"));
        location.hash = "artikel-" + rec.id;
      } catch (ex) {
        btn.disabled = false; btn.textContent = label;
        const code = ex && ex.code;
        if (code === "no_assets") showErr("Gambar tidak dapat diunggah dari tampilan ini. Hapus gambar lalu terbitkan, atau buka halaman sebagai pemilik.");
        else if (code === "too_large") showErr("Gambar terlalu besar. Batasnya 20 MB.");
        else if (code === "quota_or_state" || code === "quota_exceeded") showErr("Ruang penyimpanan penuh. Hapus beberapa tulisan lama lalu coba lagi.");
        else if (code && String(code).startsWith("gh_")) showErr(ghErrorText(ex));
        else if (code === "invalid_argument" && mode === "shared") showErr("Tulisan tidak tersimpan. Teksnya mungkin terlalu panjang (maks. sekitar 250 KB), atau akun Anda tidak punya izin mengubah situs ini.");
        else showErr("Tulisan gagal disimpan. Periksa koneksi lalu coba lagi.");
      }
    });
  }

    $("#inbox-form").addEventListener("submit", async (e) => {

    function itemHTML(it) {

        "</div>" +
        '<div class="confirm" data-role="confirm" hidden><span style="font-size:.9rem">Tolak naskah ini? Naskah dan berkasnya dibuang dari kotak masuk.</span>' +
          '<div class="form-actions"><button class="btn btn-sm btn-danger armed" type="button" data-act="reject-yes">Ya, tolak</button><button class="btn btn-sm" type="button" data-act="reject-no">Batal</button></div></div>' +
        '<div data-role="pdf"></div>' +
        '<p class="error" data-role="error" hidden style="margin:0"></p>' +
      "</article>";
    }

    function wireItem(it, el) {
      if (!el) return;
      const q = (s) => el.querySelector(s);
      const actions = q('[data-role="actions"]'), confirmBox = q('[data-role="confirm"]'), errEl = q('[data-role="error"]'), pdfSlot = q('[data-role="pdf"]');
      const showErr = (ex) => { errEl.textContent = inboxErrorText(ex); errEl.hidden = false; };
      const busy = (on) => el.querySelectorAll("button").forEach(b => { b.disabled = on; });
      let pdfBlobUrl = "";
      async function fileB64(kind) { return (await inbox({ action: "file", key, id: it.id, kind })).b64; }

      el.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]"); if (!btn) return;
        const act = btn.dataset.act;
        errEl.hidden = true;
        if (act === "pdf") {
          if (pdfSlot.firstChild) { pdfSlot.innerHTML = ""; btn.textContent = "Lihat PDF"; return; }
          btn.disabled = true; btn.textContent = "Memuat PDF…";
          try {
            if (!pdfBlobUrl) pdfBlobUrl = URL.createObjectURL(dataUrlToBlob("data:application/pdf;base64," + await fileB64("pdf")));
            pdfSlot.innerHTML = '<iframe class="pdf-frame" title="PDF naskah" src="' + pdfBlobUrl + '"></iframe>';
            btn.textContent = "Sembunyikan PDF";
          } catch (ex) { btn.textContent = "Lihat PDF"; showErr(ex); }
          btn.disabled = false;
        } else if (act === "reject") {
          actions.hidden = true; confirmBox.hidden = false;
        } else if (act === "reject-no") {
          confirmBox.hidden = true; actions.hidden = false;
        } else if (act === "reject-yes") {
          busy(true); btn.textContent = "Menolak…";
          try {
            await inbox({ action: "decide", key, id: it.id, status: "ditolak" });
            el.innerHTML = '<p class="inbox-done">Naskah <strong>' + esc(it.article.title) + "</strong> ditolak. Jangan lupa memberi kabar ke " + esc(it.email) + ".</p>";
          } catch (ex) { busy(false); btn.textContent = "Ya, tolak"; showErr(ex); }
        } else if (act === "accept") {
          busy(true);
          try {
            const a = it.article || {};
            const id = uid(), stamp = Date.now().toString(36);
            let pdfPath = "", coverPath = "";
            if (it.pdfFileId) {
              btn.textContent = "Menyalin PDF…";
              pdfPath = FILES_DIR + id + "-" + stamp + ".pdf";
              await ghPutFile(pdfPath, await fileB64("pdf"), "Unggah PDF " + id);
            }
            if (it.coverFileId) {
              btn.textContent = "Menyalin sampul…";
              coverPath = FILES_DIR + id + "-" + stamp + "-sampul.jpg";
              await ghPutFile(coverPath, await fileB64("cover"), "Unggah sampul " + id);
            }
            btn.textContent = "Menerbitkan…";
            const rec = {
              id, created: Date.now(), contoh: false, type: "tulisan",
              title: String(a.title || ""), authors: String(a.authors || ""), rubrik: String(a.rubrik || ""),
              date: new Date().toISOString().slice(0, 10), abstract: String(a.abstract || ""), body: String(a.body || ""),
              affiliation: String(a.affiliation || ""), volume: "", issue: "", pages: "", doi: "",
              keywords: String(a.keywords || ""), references: String(a.references || ""),
              pdfName: pdfPath ? String(it.pdfName || "naskah.pdf") : "", coverPath, pdfPath
            };
            await put(rec);
            try { await inbox({ action: "decide", key, id: it.id, status: "diterbitkan" }); }
            catch (ex) {
              el.innerHTML = '<p class="inbox-done">Artikel sudah terbit, tetapi status naskah di kotak masuk gagal diperbarui. Muat ulang halaman, lalu klik <strong>Tolak</strong> pada naskah ini untuk membuangnya dari daftar. <a href="#artikel-' + esc(id) + '">Lihat artikel</a></p>';
              return;
            }
            el.innerHTML = '<p class="inbox-done">Naskah <strong>' + esc(rec.title) + '</strong> diterbitkan dan tampil untuk pengunjung dalam 1–2 menit. <a href="#artikel-' + esc(id) + '">Lihat artikel</a> · <a href="#ubah-' + esc(id) + '">Isi volume, nomor, dan DOI</a></p>';
          } catch (ex) { busy(false); btn.textContent = "Terima & terbitkan"; showErr(ex); }
        }
      });
    }

    loadList();
  }

  /* ---------- Manager password: the GitHub token (and inbox key) sealed with AES-GCM ---------- */
  // config.json is public, so the token is stored only in encrypted form. PBKDF2 makes each
  // password guess slow; the password's strength is what keeps the token safe.
  const SEAL_ITER = 600000, MIN_PASS = 10;
  let adminSeal = null;   // { v, iter, salt, iv, data } from content/config.json
  let adminPass = "";     // kept in memory only, to re-seal when the inbox key changes
  const u8ToB64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const b64ToU8 = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  async function sealKey(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function sealSecrets(pass, secrets) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await sealKey(pass, salt, SEAL_ITER);
    const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(secrets))));
    return { v: 1, iter: SEAL_ITER, salt: u8ToB64(salt), iv: u8ToB64(iv), data: u8ToB64(data) };
  }
  async function openSecrets(pass, seal) {
    const key = await sealKey(pass, b64ToU8(seal.salt), seal.iter || SEAL_ITER);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToU8(seal.iv) }, key, b64ToU8(seal.data));
    return JSON.parse(new TextDecoder().decode(plain)); // wrong password -> decrypt throws
  }
  // Read-modify-write content/config.json so the inbox URL and the password seal never overwrite each other.
  async function ghUpdateConfig(mutate, message) {
    const cur = await ghGetFile(CONFIG);
    let cfg = {};
    if (cur && cur.content) { try { cfg = JSON.parse(b64ToText(cur.content)) || {}; } catch (e) { cfg = {}; } }
    mutate(cfg);
    await ghReq("PUT", "contents/" + encPath(CONFIG), { message, content: textToB64(JSON.stringify(cfg, null, 2) + "\n"), branch: gh.branch, sha: cur ? cur.sha : undefined });
    return cfg;
  }
  async function resealIfPossible() {
    if (!adminPass || !gh) return;
    const seal = await sealSecrets(adminPass, { token: gh.token, inboxKey: lsGet(INBOX_KEY) || "" });
    await ghUpdateConfig(cfg => { cfg.admin = seal; }, "Perbarui sandi pengelola");
    adminSeal = seal;
  }

    app.innerHTML =

            '<label style="display:flex;gap:8px;align-items:center;font-size:.92rem"><input type="checkbox" id="remember-pass" checked> Tetap masuk di browser ini</label>' +
          '</fieldset><p class="error" id="pass-login-error" hidden></p>' +
          '<div class="form-actions"><button class="btn btn-primary" type="submit" id="btn-login-pass">Masuk</button><a class="btn" href="#">Batal</a></div></form>' +
          '<details style="margin-top:24px"><summary style="cursor:pointer;font-family:var(--font-display)">Lupa sandi? Masuk dengan token GitHub</summary><div style="margin-top:14px">'
        : "<p>Pengelola mengunggah artikel langsung ke repositori <strong>" + esc(where.owner + "/" + where.repo) + "</strong>. Masuk pertama kali memakai <em>personal access token</em> GitHub. Setelah itu Anda bisa mengatur sandi tetap.</p>") +
      '<form class="submit" id="login" novalidate><fieldset><legend>Token GitHub</legend>' + tokenSteps +
        '<div class="field"><label for="token">Token</label><input type="text" id="token" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></div>' +
        '<label style="display:flex;gap:8px;align-items:center;font-size:.92rem"><input type="checkbox" id="remember" checked> Ingat di browser ini</label>' +
      '</fieldset><p class="error" id="login-error" hidden></p>' +
      '<div class="form-actions"><button class="btn ' + (adminSeal ? "" : "btn-primary") + '" type="submit" id="btn-login">Masuk dengan token</button>' + (adminSeal ? "" : '<a class="btn" href="#">Batal</a>') + "</div></form>" +
      (adminSeal ? "</div></details>" : "") +
      "</div></div>";

    const lp = $("#login-pass");
    if (lp) {
      $("#password").focus();
      lp.addEventListener("submit", async (e) => {

        adminPass = pass;
        if (secrets.inboxKey) lsSet(INBOX_KEY, secrets.inboxKey);

    $("#login").addEventListener("submit", async (e) => {
      e.preventDefault();

      const problem = await ghSignIn(token);
      if (problem) { btn.disabled = false; btn.textContent = "Masuk dengan token"; err.textContent = problem; err.hidden = false; return; }
