<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tandeallo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tandeallo — portal yang memadukan jurnal ilmiah dan berita. Unggah, baca, dan kutip artikel langsung dari browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: masthead + lead story beside a "terbitan jurnal" index, then a mixed feed; article pages use a reading column with a metadata rail. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #14211f;
  --muted: #5a6865;
  --line: #d6dddb;
  --accent: #0f5c55;      /* jurnal / ilmiah */
  --accent-ink: #ffffff;
  --news: #b8760f;        /* berita */
  --news-soft: #f6ead3;
  --accent-soft: #dcebe8;
  --danger: #b3261e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --surface: #172120; --ink: #e5ecea; --muted: #9aa9a6; --line: #2a3735;
    --accent: #5cc2b5; --accent-ink: #062521; --news: #e8b04d; --news-soft: #3a2c12; --accent-soft: #163a36;
    --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1615; --surface: #172120; --ink: #e5ecea; --muted: #9aa9a6; --line: #2a3735;
  --accent: #5cc2b5; --accent-ink: #062521; --news: #e8b04d; --news-soft: #3a2c12; --accent-soft: #163a36;
  --danger: #ff8a80; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
}
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Masthead ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.masthead { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.masthead .wrap { display: flex; align-items: center; gap: 20px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; margin-right: auto; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; }
.brand-name span { color: var(--accent); }
.brand-tag { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav a { font-family: var(--font-display); font-weight: 500; text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: .95rem; }
.nav a:hover { background: var(--bg); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: .95rem;
  padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--ink); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { color: var(--danger); }
.btn-danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn-sm { padding: 6px 11px; font-size: .85rem; }

/* ---------- Ticker / toolbar ---------- */
.toolbar .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 18px 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: var(--font-display); font-weight: 500; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.search { flex: 1 1 240px; min-width: 0; display: flex; }
.search input { width: 100%; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.today { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

/* ---------- Tags ---------- */
.tag { display: inline-block; font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 3px; font-weight: 500; }
.tag-berita { background: var(--news-soft); color: var(--news); }
.tag-jurnal { background: var(--accent-soft); color: var(--accent); }
.tag-contoh { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.meta { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

/* ---------- Lead ---------- */
.lead { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 32px; padding-block: 18px 34px; }
.lead-story { text-decoration: none; display: grid; gap: 14px; }
.lead-story h2 { font-family: var(--font-display); font-size: clamp(1.7rem, 3.4vw, 2.6rem); line-height: 1.08; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead-story:hover h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.lead-story p { margin: 0; color: var(--muted); max-width: 62ch; }
.cover { aspect-ratio: 16 / 9; width: 100%; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--accent-soft); position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover-fallback { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 16px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.8rem); color: var(--accent); letter-spacing: -0.01em;
  background:
    repeating-linear-gradient(135deg, transparent 0 18px, color-mix(in srgb, var(--accent) 10%, transparent) 18px 19px),
    var(--accent-soft); }
.cover-fallback.berita { color: var(--news);
  background:
    repeating-linear-gradient(90deg, transparent 0 22px, color-mix(in srgb, var(--news) 14%, transparent) 22px 23px),
    var(--news-soft); }

.issue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 4px; align-self: start; }
.issue-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 6px; }
.issue-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
.issue-item { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.issue-item:last-child { border-bottom: 0; }
.issue-item strong { font-family: var(--font-display); font-weight: 700; line-height: 1.25; font-size: 1.02rem; }
.issue-item:hover strong { color: var(--accent); }
.issue-item .auth { font-size: .88rem; color: var(--muted); font-style: italic; }

/* ---------- Feed ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
.section-title h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; padding-bottom: 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--ink); transform: translateY(-2px); }
.card .cover { border-radius: 0; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.card h3 { font-family: var(--font-display); font-size: 1.18rem; line-height: 1.22; margin: 0; text-wrap: balance; }
.card p { margin: 0; font-size: .95rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-foot { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
.card.jurnal .card-body { border-top: 4px solid var(--accent); }
.card.jurnal .abs-label { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); grid-column: 1 / -1; }

/* ---------- Article ---------- */
.article { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; padding-block: 28px 64px; }
.article-main { min-width: 0; max-width: 720px; }
.back { font-family: var(--font-display); text-decoration: none; color: var(--muted); font-size: .92rem; display: inline-block; margin-bottom: 18px; }
.back:hover { color: var(--ink); }
.eyebrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.article h1 { font-family: var(--font-display); font-size: clamp(1.9rem, 4.4vw, 3rem); line-height: 1.06; letter-spacing: -0.025em; margin: 0 0 16px; text-wrap: balance; }
.byline { font-size: 1.02rem; margin-bottom: 4px; }
.affil { color: var(--muted); font-size: .92rem; font-style: italic; margin-bottom: 14px; }
.abstract { background: var(--accent-soft); border-radius: var(--radius); padding: 18px 22px; margin: 22px 0; }
.abstract h2 { font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 8px; color: var(--accent); }
.abstract p { margin: 0; font-size: .98rem; }
.kw { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.kw span { font-family: var(--font-mono); font-size: .75rem; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
.prose { font-size: 1.08rem; line-height: 1.75; }
.prose p { margin: 0 0 1.1em; }
.prose h3 { font-family: var(--font-display); font-size: 1.35rem; margin: 1.6em 0 .5em; line-height: 1.2; }
.prose blockquote { margin: 1.4em 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--news); font-style: italic; color: var(--muted); }
.article.berita .prose > p:first-child::first-letter { font-family: var(--font-display); font-weight: 800; float: left; font-size: 3.4em; line-height: .9; padding: 6px 10px 0 0; color: var(--news); }
.refs { margin-top: 36px; border-top: 2px solid var(--ink); padding-top: 14px; }
.refs h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 10px; }
.refs ol { padding-left: 1.4em; margin: 0; font-size: .93rem; display: grid; gap: 8px; overflow-wrap: anywhere; }
.article-cover { margin: 8px 0 26px; }
.caption { font-size: .82rem; color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }

.rail { display: flex; flex-direction: column; gap: 16px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .85rem; }
.panel dt { color: var(--muted); font-family: var(--font-mono); font-size: .75rem; padding-top: 2px; }
.panel dd { margin: 0; overflow-wrap: anywhere; }
.cite-box { font-size: .85rem; background: var(--bg); border-radius: 4px; padding: 10px; overflow-wrap: anywhere; user-select: all; }
.pdf-frame { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: var(--radius); margin-top: 18px; background: var(--surface); }

/* ---------- Form ---------- */
.form-page { padding-block: 28px 64px; max-width: 860px; }
.form-page h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 6px; letter-spacing: -0.02em; }
.form-page > p { color: var(--muted); margin: 0 0 24px; }
form.submit { display: grid; gap: 22px; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 20px; margin: 0; background: var(--surface); display: grid; gap: 16px; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 700; padding: 0 6px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-family: var(--font-display); font-weight: 500; font-size: .95rem; }
.field .hint { font-size: .8rem; color: var(--muted); font-family: var(--font-mono); }
.field input[type="text"], .field input[type="date"], .field input[type="url"], .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
.field textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
.field textarea.big { min-height: 280px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 16px; }
.type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-pick label { border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; background: var(--surface); }
.type-pick input { position: absolute; opacity: 0; pointer-events: none; }
.type-pick strong { font-family: var(--font-display); font-size: 1.1rem; }
.type-pick span { font-size: .85rem; color: var(--muted); }
.type-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.type-pick label.berita:has(input:checked) { border-color: var(--news); background: var(--news-soft); }
.type-pick label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; background: var(--bg); min-width: 0; }
.drop input[type="file"] { max-width: 100%; min-width: 0; }
.drop.over { border-color: var(--accent); }
.drop .preview { max-height: 180px; border-radius: 4px; object-fit: cover; }
.form-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.error { color: var(--danger); font-size: .9rem; }

/* ---------- Inbox ---------- */
.inbox { display: grid; gap: 16px; }
.inbox-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 10px; min-width: 0; }
.inbox-item h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.inbox-item details summary { cursor: pointer; font-family: var(--font-display); font-size: .92rem; }
.inbox-item .prose { font-size: .98rem; margin-top: 10px; overflow-wrap: anywhere; }
.inbox-item .abstract { margin: 10px 0; }
.inbox-item .confirm { display: grid; gap: 8px; }
.inbox-done { color: var(--muted); font-size: .95rem; }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ---------- Footer ---------- */
footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 28px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
footer p { margin: 0; font-size: .88rem; color: var(--muted); max-width: 60ch; }
.foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-family: var(--font-display); font-size: .92rem; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  .lead, .article { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand-tag { display: none; }
  .type-pick { grid-template-columns: 1fr; }
  .masthead .wrap { gap: 10px; }
  .masthead { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="#">
      <span class="brand-name">Tande<span>allo</span></span>
      <span class="brand-tag">Jurnal &amp; Warta</span>
    </a>
    <nav class="nav" aria-label="Navigasi utama">
      <a href="#" data-nav="beranda">Beranda</a>
      <a href="#berita" data-nav="berita">Berita</a>
      <a href="#jurnal" data-nav="jurnal">Jurnal</a>
      <a href="#kirim-naskah" data-nav="naskah" hidden>Kirim Naskah</a>
      <a href="#tinjau" data-nav="tinjau" hidden>Tinjau Naskah</a>
      <a href="#kirim" class="btn btn-primary btn-sm" data-nav="kirim">+ Unggah Artikel</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <p id="storage-note">Artikel tersimpan di browser perangkat ini (IndexedDB). Buat cadangan secara berkala, lalu pulihkan di perangkat lain lewat tombol Impor.</p>
    <div class="foot-actions">
      <a class="btn btn-sm" id="btn-admin" href="#masuk" hidden>Masuk pengelola</a>
      <button class="btn btn-sm" id="btn-export" type="button">Ekspor cadangan (.json)</button>
      <button class="btn btn-sm" id="btn-copy-backup" type="button">Salin cadangan</button>
      <label class="btn btn-sm" for="import-file">Impor cadangan</label>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";

  /* =====================================================================
     Storage. Two modes:
     - "shared": opened as a published claude.ai artifact. Articles live in the
       artifact's shared database; PDFs and covers are uploaded as assets.
       Everyone who opens the link reads; only owner/editors write.
     - "local":  index.html opened directly or hosted statically. Articles live
       in this browser's IndexedDB (with an in-memory fallback).
     - "github": hosted on GitHub Pages with content/articles.json in the repo.
       Everyone reads the static file; the owner signs in with a GitHub token
       and the page commits articles and files to the repo via the GitHub API.
     - "closed": inside the artifact viewer but the shared store is unavailable
       (e.g. signed out). Read-only, nothing to show.
     ===================================================================== */
  const DB_NAME = "tandeallo", STORE = "articles", COLL = "articles";
  let idb = null, memory = [];
  let mode = "local", shared = null, assetsCap = null, dl = null, canWrite = true;
  // Fallback repo for GitHub mode; on <owner>.github.io/<repo> it is read from the address.
  const GH_DEFAULT = { owner: "WisarTandeallo", repo: "Tandeallo" };
  const CONTENT = "content/articles.json", FILES_DIR = "content/files/", TOKEN_KEY = "tandeallo-gh-token";
  let gh = null; // { owner, repo, branch, token } once the manager is signed in
  // Public submissions go to a Google Apps Script web app (apps-script/Code.gs); its URL lives in content/config.json.
  const CONFIG = "content/config.json", INBOX_KEY = "tandeallo-inbox-key";
  const INBOX_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/;
  let submitUrl = "";
  async function inbox(payload) {
    let r;
    try {
      // text/plain keeps this a "simple" request, so the browser sends no preflight Apps Script cannot answer.
      r = await fetch(submitUrl, { method: "POST", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" }, cache: "no-store", redirect: "follow" });
    } catch (e) { throw { code: "inbox_net" }; }
    let data = null;
    try { data = await r.json(); } catch (e) { throw { code: "inbox_bad" }; }
    if (!data || !data.ok) throw { code: "inbox_" + ((data && data.error) || "err"), message: data && data.detail };
    return data;
  }
  function inboxErrorText(e) {
    const c = e && e.code;
    if (c === "inbox_kunci") return "Kunci admin salah. Salin lagi kunci dari Log eksekusi fungsi setup di Apps Script.";
    if (c === "inbox_net" || c === "inbox_bad") return "Kotak masuk tidak bisa dihubungi. Periksa koneksi, dan pastikan aplikasi web diterapkan dengan akses \"Siapa saja\".";
    if (c === "inbox_tidak-ada") return "Naskah ini sudah tidak ada di kotak masuk. Muat ulang halaman.";
    if (c === "inbox_server") return "Kotak masuk mengalami galat" + (e.message ? " (" + e.message + ")" : "") + ".";

            '<a class="issue-item" href="#artikel-' + esc(j.id) + '"><span class="meta">' + esc(j.pages ? "hlm. " + j.pages : fmtDate(j.date)) + (j.doi ? " · DOI" : "") + "</span><strong>" + esc(j.title) + '</strong><span class="auth">' + esc(authorLine(j)) + "</span></a>").join("")

        '<div class="search"><input id="q" type="search" placeholder="Cari judul, penulis, kata kunci…" aria-label="Cari artikel" value="' + esc(view.query) + '"></div>' +

      "</div></section>" + lead +

      const f = b.dataset.filter;
      if (f === "semua") { history.replaceState(null, "", location.pathname + location.search); renderHome("semua"); }
      else location.hash = f;

  function renderFeed() {
    const feed = $("#feed"); if (!feed) return;
    const q = view.query.trim().toLowerCase();
    let list = sorted(articles).filter(a => view.filter === "semua" || a.type === view.filter);
    if (q) list = list.filter(a => [a.title, a.authors, a.keywords, a.abstract, a.rubrik, a.body].join(" ").toLowerCase().includes(q));
    const titles = { semua: "Semua Artikel", berita: "Berita", jurnal: "Artikel Jurnal" };
    $("#feed-title").textContent = q ? 'Hasil pencarian "' + view.query.trim() + '"' : titles[view.filter];
    $("#feed-count").textContent = list.length + " artikel";
    const status = statusBox();
    if (status && !list.length) { feed.innerHTML = status; return; }
    feed.innerHTML = list.length ? list.map(cardHTML).join("") :
      '<div class="empty">' + (q ? "Tidak ada artikel yang cocok. Coba kata kunci lain." :
        "Belum ada artikel di sini." + (canWrite ? ' <a href="#kirim">Unggah artikel pertama</a>.' : " Kembali lagi nanti.")) + "</div>";
  }

  function cardHTML(a) {
    const hasPdf = a.pdf || a.pdfId || a.pdfPath;

      return '<a class="card jurnal" href="#artikel-' + esc(a.id) + '"><div class="card-body">' +
        '<div class="row">' + tags(a) + "</div>" +
        "<h3>" + esc(a.title) + "</h3>" +
        '<span class="meta">' + esc(authorLine(a)) + "</span>" +
        (a.abstract ? '<span class="abs-label">Abstrak</span><p>' + esc(a.abstract) + "</p>" : "") +
        '<div class="card-foot meta">' + esc(issueLabel(a) || fmtDate(a.date)) + (hasPdf ? " · PDF" : "") + (a.doi ? " · doi:" + esc(a.doi) : "") + "</div>" +
        "</div></a>";
    }
    return '<a class="card berita" href="#artikel-' + esc(a.id) + '">' + coverHTML(a) + '<div class="card-body">' +
      '<div class="row">' + tags(a) + "</div>" +
      "<h3>" + esc(a.title) + "</h3>" +
      (a.abstract ? "<p>" + esc(a.abstract) + "</p>" : "") +
      '<div class="card-foot meta">' + fmtDate(a.date) + " · " + readTime(a) + "</div>" +
      "</div></a>";
  }

  function renderArticle(id) {
    const a = articles.find(x => x.id === id);

    if (pdfUrl && pdfUrl.startsWith("blob:")) URL.revokeObjectURL(pdfUrl);

    if (a.pdf) { try { pdfUrl = URL.createObjectURL(dataUrlToBlob(a.pdf)); } catch (e) { pdfUrl = null; } }
    else if (a.pdfId) pdfUrl = assetUrl(a.pdfId);
    else if (repoFile(a.pdfPath)) pdfUrl = repoFile(a.pdfPath);
    const pdfName = a.pdfName || "artikel.pdf";
    const isJ = a.type === "jurnal";
    const refList = String(a.references || "").split("\n").map(x => x.trim()).filter(Boolean);

    app.innerHTML =
      '<article class="wrap article ' + esc(a.type) + '"><div class="article-main">' +
        '<a class="back" href="#' + (isJ ? "jurnal" : "berita") + '">← Kembali ke ' + (isJ ? "Jurnal" : "Berita") + "</a>" +
        '<div class="eyebrow">' + tags(a) + (isJ && issueLabel(a) ? '<span class="meta">' + esc(issueLabel(a)) + "</span>" : "") + "</div>" +
        "<h1>" + esc(a.title) + "</h1>" +
        '<div class="byline">' + (isJ ? "" : "Oleh ") + "<strong>" + esc(authorLine(a)) + "</strong></div>" +
        (a.affiliation ? '<div class="affil">' + esc(a.affiliation) + "</div>" : "") +
        '<div class="meta">' + (isJ ? "Terbit " : "") + fmtDate(a.date) + " · " + readTime(a) + "</div>" +
        (!isJ ? '<figure class="article-cover" style="margin-inline:0">' + coverHTML(a) + "</figure>" : "") +
        (isJ && a.abstract ? '<section class="abstract"><h2>Abstrak</h2><p>' + esc(a.abstract) + "</p>" +
          (a.keywords ? '<div class="kw"><span class="meta" style="border:0;padding:0;color:var(--muted)">Kata kunci:</span>' + splitList(a.keywords).map(k => "<span>" + esc(k) + "</span>").join("") + "</div>" : "") +
        "</section>" : "") +
        (!isJ && a.abstract ? '<p style="font-size:1.15rem;color:var(--muted);margin:0 0 1.2em">' + esc(a.abstract) + "</p>" : "") +

          '<span class="meta">' + esc(a.pdfName || "") + "</span></div>" : "") +
        (isJ ? '<div class="panel"><h3>Informasi artikel</h3><dl>' +

          '<div class="panel"><h3>Cara mengutip (APA)</h3><div class="cite-box" id="cite">' + esc(citation(a)) + '</div><button class="btn btn-sm" type="button" id="btn-cite">Salin kutipan</button></div>'
          : "") +
        (canWrite ? '<div class="panel"><h3>Kelola</h3>' +
          '<a class="btn btn-sm" href="#ubah-' + esc(a.id) + '">Ubah artikel</a>' +
          '<button class="btn btn-sm btn-danger" type="button" id="btn-del">Hapus artikel</button>' +
          '<div id="del-confirm" hidden style="display:grid;gap:8px">' +
            '<span style="font-size:.88rem">Hapus artikel ini untuk semua pengunjung? Tindakan ini tidak bisa dibatalkan.</span>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm btn-danger armed" type="button" id="btn-del-yes">Ya, hapus</button>' +

      del.addEventListener("click", () => { del.hidden = true; box.hidden = false; derr.hidden = true; yes.focus(); });
      no.addEventListener("click", () => { box.hidden = true; del.hidden = false; });
      yes.addEventListener("click", async () => {
        yes.disabled = true; no.disabled = true; yes.textContent = "Menghapus…";

          await remove(a.id);
          articles = articles.filter(x => x.id !== a.id);

          yes.disabled = false; no.disabled = false; yes.textContent = "Ya, hapus";

          derr.textContent =
            code === "invalid_argument" ? "Akun Anda tidak punya izin menghapus artikel di halaman ini." :
            code && code.startsWith("gh_") ? ghErrorText(e) :

          derr.hidden = false;

      });

    const c = $("#btn-cite"); if (c) c.addEventListener("click", () => copyText(citation(a), $("#cite")));
    const v = $("#btn-view-pdf");

      const slot = $("#pdf-slot");
      if (slot.firstChild) { slot.innerHTML = ""; v.textContent = "Tampilkan PDF di halaman"; return; }

    });
    const d = $("#btn-dl-pdf");
    if (d) d.addEventListener("click", async () => {
      try {
        const blob = a.pdf ? dataUrlToBlob(a.pdf) : await (await fetch(pdfUrl)).blob();
        await saveFile(pdfName, blob);
      } catch (e) { toast("PDF tidak dapat diunduh saat ini"); }
    });
  }

  function renderForm(editId, opts) {

          '<label class="jurnal"><input type="radio" name="type" id="type-jurnal" value="jurnal"' + (d.type === "jurnal" ? " checked" : "") + '><strong>Jurnal</strong><span>Artikel penelitian dengan abstrak &amp; PDF</span></label>' +
        "</div>" +

              [...new Set(articles.map(x => x.rubrik).filter(Boolean))].map(r => '<option value="' + esc(r) + '">').join("") + "</datalist></div>" +
          "</div>" +
          '<div class="grid-2">' +
            (sub ? "" : '<div class="field"><label for="date">Tanggal terbit</label><input type="date" id="date" name="date" value="' + v("date") + '"></div>') +

            '<div class="field"><label for="issue">Nomor</label><input type="text" id="issue" name="issue" value="' + v("issue") + '"></div>' +
            '<div class="field"><label for="pages">Halaman</label><input type="text" id="pages" name="pages" placeholder="mis. 101–118" value="' + v("pages") + '"></div>' +

        "<fieldset><legend>Berkas</legend>" +
          '<div class="grid-2">' +
            '<div class="drop" id="drop-cover"><label for="cover">Gambar sampul (JPG/PNG)</label><input type="file" id="cover" accept="image/*"><img class="preview" id="cover-preview" alt="Pratinjau sampul"' + (previewSrc ? ' src="' + esc(previewSrc) + '"' : " hidden") + '><button type="button" class="btn btn-sm" id="cover-clear"' + (previewSrc ? "" : " hidden") + ">Hapus gambar</button></div>" +

        '<p class="error" id="form-error" hidden></p>' +
        '<div class="form-actions"><button class="btn btn-primary" type="submit" id="btn-submit">' + (sub ? "Kirim naskah" : a ? "Simpan perubahan" : "Terbitkan") + '</button><a class="btn" href="' + (a ? "#artikel-" + esc(a.id) : "#") + '">Batal</a></div>' +
      "</form></div></div>";

    const form = $("#f");

      const isJ = form.type.value === "jurnal";

      $("#abstract-label").textContent = isJ ? "Abstrak" : "Ringkasan / lead";
    }
    form.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener("change", syncType));
    syncType();

    async function setCover(file) {
      if (!file || !file.type.startsWith("image/")) return;
      const p = $("#cover-preview");
      if (remoteFiles()) {
        draft.coverBlob = await resizeToBlob(file); draft.cover = "";
        p.src = URL.createObjectURL(draft.coverBlob);
      } else {
        draft.cover = await resizeToDataUrl(file); p.src = draft.cover;
      }
      p.hidden = false; $("#cover-clear").hidden = false;
    }
    async function setPdf(file) {
      if (!file) return;
      if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast("Berkas harus berformat PDF"); return; }
      if (file.size > maxMb * 1024 * 1024) { toast("PDF terlalu besar (maks. " + maxMb + " MB)"); return; }
      if (remoteFiles()) { draft.pdfBlob = file; draft.pdf = ""; }
      else draft.pdf = await readFile(file);
      draft.pdfName = file.name;
      $("#pdf-name").textContent = file.name + " · " + (file.size / 1024 / 1024).toFixed(1) + " MB"; $("#pdf-clear").hidden = false;
    }
    $("#cover").addEventListener("change", e => setCover(e.target.files[0]));
    $("#pdf").addEventListener("change", e => setPdf(e.target.files[0]));
    $("#cover-clear").addEventListener("click", () => { draft.cover = ""; draft.coverId = ""; draft.coverPath = ""; draft.coverBlob = null; $("#cover-preview").hidden = true; $("#cover-clear").hidden = true; $("#cover").value = ""; });

          action: "submit", website: get("website"), name: get("sender"), email: get("email"),
          article: {
            type, title: get("title"), authors: get("authors"), rubrik: get("rubrik"),
            affiliation: isJ ? get("affiliation") : "", abstract: get("abstract"), body: get("body"),
            references: isJ ? get("references") : "", keywords: isJ ? get("keywords") : ""
          },
          pdfName: draft.pdfBlob ? draft.pdfName : "",
          pdf: draft.pdfBlob ? await blobToB64(draft.pdfBlob) : "",
          cover: draft.coverBlob ? await blobToB64(draft.coverBlob) : ""
        });
        app.innerHTML = '<div class="wrap"><div class="form-page"><h1>Naskah terkirim</h1>' +
          "<p>Terima kasih. Redaksi akan meninjau naskah <strong>" + esc(get("title")) + "</strong> dan menghubungi Anda di <strong>" + esc(get("email")) + "</strong>. Naskah tampil di website setelah diterima.</p>" +
          '<div class="form-actions"><a class="btn btn-primary" href="#">Kembali ke beranda</a><a class="btn" href="#kirim-naskah">Kirim naskah lain</a></div></div></div>';
        // Leave #kirim-naskah so the menu link and "Kirim naskah lain" open a fresh form.
        history.replaceState(null, "", location.pathname + location.search + "#terkirim");
        window.scrollTo(0, 0);
      } catch (ex) {
        btn.disabled = false; btn.textContent = "Kirim naskah";
        const c = ex && ex.code;
        showErr(c === "inbox_data" ? "Periksa kembali judul, penulis, isi, dan email Anda." :
          c === "inbox_berkas" ? "Berkas tidak bisa diterima. PDF harus berupa berkas PDF asli, maksimal 10 MB." :
          c === "inbox_net" || c === "inbox_bad" ? "Naskah gagal dikirim. Periksa koneksi internet lalu coba lagi." :
          "Naskah gagal dikirim. Coba lagi beberapa saat lagi.");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const get = (k) => String(fd.get(k) || "").trim();
      const err = $("#form-error");
      const showErr = (m) => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "center" }); };
      const missing = [];
      if (!get("title")) missing.push("judul");
      if (!get("authors")) missing.push("penulis");
      if (!get("body") && !get("abstract") && !(draft.pdf || draft.pdfId || draft.pdfPath || draft.pdfBlob)) missing.push("isi, ringkasan, atau berkas PDF");
      if (sub && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(get("email"))) missing.push("email yang valid");
      if (sub && !form.agree.checked) missing.push("centang pernyataan keaslian naskah");
      if (missing.length) { showErr("Lengkapi dulu: " + missing.join(", ") + "."); return; }
      err.hidden = true;
      if (sub) { await sendSubmission(get, showErr); return; }
      const btn = $("#btn-submit"); const label = btn.textContent;
      btn.disabled = true; btn.textContent = "Menyimpan…";
      try {
        if (mode === "shared" && (draft.coverBlob || draft.pdfBlob)) {
          if (!assetsCap) throw { code: "no_assets" };
          if (draft.coverBlob) { btn.textContent = "Mengunggah gambar…"; draft.coverId = (await assetsCap.upload(draft.coverBlob, { type: "image/jpeg" })).id; draft.coverBlob = null; }
          if (draft.pdfBlob) { btn.textContent = "Mengunggah PDF…"; draft.pdfId = (await assetsCap.upload(draft.pdfBlob, { type: "application/pdf" })).id; draft.pdfBlob = null; }
          btn.textContent = "Menyimpan…";
        }
        const newId = a ? a.id : uid();
        if (mode === "github" && (draft.coverBlob || draft.pdfBlob)) {
          const stamp = Date.now().toString(36);
          if (draft.coverBlob) {
            btn.textContent = "Mengunggah gambar…";
            const path = FILES_DIR + newId + "-" + stamp + "-sampul.jpg";
            await ghPutFile(path, await blobToB64(draft.coverBlob), "Unggah sampul " + newId);
            draft.coverPath = path; draft.coverBlob = null;
          }
          if (draft.pdfBlob) {
            btn.textContent = "Mengunggah PDF…";
            const path = FILES_DIR + newId + "-" + stamp + ".pdf";
            await ghPutFile(path, await blobToB64(draft.pdfBlob), "Unggah PDF " + newId);
            draft.pdfPath = path; draft.pdfBlob = null;
          }
          btn.textContent = "Menyimpan…";
        }
        const type = get("type") || "berita";
        const isJ = type === "jurnal";
        const rec = {
          id: newId, created: a ? a.created || Date.now() : Date.now(), contoh: false, type,
          title: get("title"), authors: get("authors"), rubrik: get("rubrik"), date: get("date") || new Date().toISOString().slice(0, 10),
          abstract: get("abstract"), body: get("body"),
          affiliation: isJ ? get("affiliation") : "", volume: isJ ? get("volume") : "",
          issue: isJ ? get("issue") : "", pages: isJ ? get("pages") : "",
          doi: isJ ? get("doi").replace(/^https?:\/\/(dx\.)?doi\.org\//, "") : "",
          keywords: isJ ? get("keywords") : "", references: isJ ? get("references") : "",
          pdfName: (draft.pdf || draft.pdfId || draft.pdfPath) ? draft.pdfName : ""
        };
        if (mode === "shared") { rec.coverId = draft.coverId; rec.pdfId = draft.pdfId; }
        else if (mode === "github") { rec.coverPath = draft.coverPath; rec.pdfPath = draft.pdfPath; }
        else { rec.cover = draft.cover; rec.pdf = draft.pdf; }
        await put(rec);
        articles = articles.filter(x => x.id !== rec.id).concat(rec);
        if (mode === "shared" && a) {
          if (a.coverId && a.coverId !== rec.coverId) await dropAsset(a.coverId);
          if (a.pdfId && a.pdfId !== rec.pdfId) await dropAsset(a.pdfId);
        }
        if (mode === "github" && a) {
          if (a.coverPath && a.coverPath !== rec.coverPath) await ghDeleteFile(a.coverPath);
          if (a.pdfPath && a.pdfPath !== rec.pdfPath) await ghDeleteFile(a.pdfPath);
        }
        toast(mode === "github" ? "Tersimpan di GitHub. Pengunjung melihatnya dalam 1–2 menit." : (a ? "Perubahan disimpan" : "Artikel diterbitkan"));
        location.hash = "artikel-" + rec.id;
      } catch (ex) {
        btn.disabled = false; btn.textContent = label;
        const code = ex && ex.code;
        if (code === "no_assets") showErr("Berkas tidak dapat diunggah dari tampilan ini. Hapus gambar/PDF lalu terbitkan, atau buka halaman sebagai pemilik.");
        else if (code === "too_large") showErr("Berkas terlalu besar. Batasnya 20 MB per berkas.");
        else if (code === "quota_or_state" || code === "quota_exceeded") showErr("Ruang penyimpanan penuh. Hapus beberapa artikel lama lalu coba lagi.");
        else if (code && String(code).startsWith("gh_")) showErr(ghErrorText(ex));
        else if (code === "invalid_argument" && mode === "shared") showErr("Artikel tidak tersimpan. Teksnya mungkin terlalu panjang (maks. sekitar 250 KB), atau akun Anda tidak punya izin mengubah situs ini.");
        else showErr("Artikel gagal disimpan. Periksa koneksi lalu coba lagi.");
      }
    });
  }

    async function loadList() {
      const box = $("#inbox-list");

    function itemHTML(it) {
      const a = it.article || {};

      const sent = it.submitted ? new Date(it.submitted).toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

          (refs.length ? '<section class="refs"><h2>Daftar Pustaka</h2><ol>' + refs.map(r => "<li>" + esc(r) + "</li>").join("") + "</ol></section>" : "") +

        '<div class="form-actions" data-role="actions">' +

          '<button class="btn btn-sm btn-danger" type="button" data-act="reject">Tolak</button>' +

        '<div class="confirm" data-role="confirm" hidden><span style="font-size:.9rem">Tolak naskah ini? Naskah dan berkasnya dibuang dari kotak masuk.</span>' +

        '<div data-role="pdf"></div>' +
        '<p class="error" data-role="error" hidden style="margin:0"></p>' +
      "</article>";
    }

    function wireItem(it, el) {
      if (!el) return;
      const q = (s) => el.querySelector(s);
      const actions = q('[data-role="actions"]'), confirmBox = q('[data-role="confirm"]'), errEl = q('[data-role="error"]'), pdfSlot = q('[data-role="pdf"]');
      const showErr = (ex) => { errEl.textContent = inboxErrorText(ex); errEl.hidden = false; };
      const busy = (on) => el.querySelectorAll("button").forEach(b => { b.disabled = on; });
      let pdfBlobUrl = "";
      async function fileB64(kind) { return (await inbox({ action: "file", key, id: it.id, kind })).b64; }

      el.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]"); if (!btn) return;

          actions.hidden = true; confirmBox.hidden = false;

          try {
            await inbox({ action: "decide", key, id: it.id, status: "ditolak" });
            el.innerHTML = '<p class="inbox-done">Naskah <strong>' + esc(it.article.title) + "</strong> ditolak. Jangan lupa memberi kabar ke " + esc(it.email) + ".</p>";
          } catch (ex) { busy(false); btn.textContent = "Ya, tolak"; showErr(ex); }

            }
            if (it.coverFileId) {
              btn.textContent = "Menyalin sampul…";
              coverPath = FILES_DIR + id + "-" + stamp + "-sampul.jpg";
              await ghPutFile(coverPath, await fileB64("cover"), "Unggah sampul " + id);
            }
            btn.textContent = "Menerbitkan…";
            const rec = {
              id, created: Date.now(), contoh: false, type: isJ ? "jurnal" : "berita",
              title: String(a.title || ""), authors: String(a.authors || ""), rubrik: String(a.rubrik || ""),
              date: new Date().toISOString().slice(0, 10), abstract: String(a.abstract || ""), body: String(a.body || ""),
              affiliation: isJ ? String(a.affiliation || "") : "", volume: "", issue: "", pages: "", doi: "",
              keywords: isJ ? String(a.keywords || "") : "", references: isJ ? String(a.references || "") : "",
              pdfName: pdfPath ? String(it.pdfName || "naskah.pdf") : "", coverPath, pdfPath
            };
            await put(rec);
            try { await inbox({ action: "decide", key, id: it.id, status: "diterbitkan" }); }
            catch (ex) {
              el.innerHTML = '<p class="inbox-done">Artikel sudah terbit, tetapi status naskah di kotak masuk gagal diperbarui. Muat ulang halaman, lalu klik <strong>Tolak</strong> pada naskah ini untuk membuangnya dari daftar. <a href="#artikel-' + esc(id) + '">Lihat artikel</a></p>';

          } catch (ex) { busy(false); btn.textContent = "Terima & terbitkan"; showErr(ex); }
        }
      });
    }

    loadList();
  }

  /* ================= Router ================= */
  function route(scroll) {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h.startsWith("artikel-")) renderArticle(h.slice(8));
    else if (h.startsWith("ubah-")) renderForm(h.slice(5));
    else if (h === "kirim") renderForm(null);
    else if (h === "masuk") renderLogin();
    else if (h === "kirim-naskah") renderForm(null, { submission: true });
    else if (h === "tinjau") renderReview();
    else if (h === "berita" || h === "jurnal") { if (view.filter !== h) view.query = ""; renderHome(h); }
    else { if (view.filter !== "semua") view.query = ""; renderHome("semua"); }
    if (scroll) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => route(true));

  // Re-render after live data changes without disturbing what the reader is doing.
  function refresh() {
    const h = location.hash.replace(/^#/, "");
    if (h === "kirim" || h === "kirim-naskah" || h === "tinjau" || h.startsWith("ubah-")) {
      if (!$("#f")) route(false); // the form was waiting for data
      return;
    }
    if (h.startsWith("artikel-")) {
      const a = articles.find(x => x.id === decodeURIComponent(h.slice(8)));
      if (a && JSON.stringify(a) === lastArticleJSON) return;
      route(false); return;
    }
    if (document.activeElement && document.activeElement.id === "q") { renderFeed(); return; }
    route(false);
  }

  /* ================= Backup ================= */
  function backupJSON() { return JSON.stringify({ app: "tandeallo", version: 1, exported: new Date().toISOString(), articles }, null, 2); }
  $("#btn-export").addEventListener("click", () => {
    saveFile("tandeallo-cadangan-" + new Date().toISOString().slice(0, 10) + ".json", new Blob([backupJSON()], { type: "application/json" }));
  });
  $("#btn-copy-backup").addEventListener("click", () => copyText(backupJSON()));
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0]; if (!file) return;
    e.target.value = "";
    let list;
    try {
      const data = JSON.parse(await file.text());
      list = Array.isArray(data) ? data : data.articles;
      if (!Array.isArray(list)) throw new Error("format");
    } catch (ex) { toast("Berkas cadangan tidak dikenali"); return; }
    toast("Memulihkan " + list.length + " artikel…");
    let n = 0, skipped = 0;
    if (mode === "github") {
      const recs = [];
      for (const raw of list) {
        if (!raw || !raw.id || !raw.title) continue;
        const a = Object.assign({}, raw);
        try {
          const stamp = Date.now().toString(36);
          if (a.cover) { const p = FILES_DIR + a.id + "-" + stamp + "-sampul.jpg"; await ghPutFile(p, a.cover.split(",")[1], "Impor sampul " + a.id); a.coverPath = p; }
          if (a.pdf) { const p = FILES_DIR + a.id + "-" + stamp + ".pdf"; await ghPutFile(p, a.pdf.split(",")[1], "Impor PDF " + a.id); a.pdfPath = p; }
        } catch (x) { skipped++; }
        delete a.cover; delete a.pdf; delete a.coverId; delete a.pdfId;
        recs.push(a);
      }
      try {
        await ghSaveArticles(cur => { const ids = new Set(recs.map(r => r.id)); return cur.filter(x => !ids.has(x.id)).concat(recs); }, "Impor " + recs.length + " artikel");
        n = recs.length;
      } catch (x) { skipped = recs.length; }
      toast(n + " artikel dipulihkan" + (skipped ? ", " + skipped + " gagal" : ""));
      route(false); return;
    }
    for (const raw of list) {
      if (!raw || !raw.id || !raw.title) continue;
      const a = Object.assign({}, raw);
      try {
        if (mode === "shared") {
          // Local backups embed files as data URLs; move them into asset storage.
          if (a.cover && assetsCap) { try { a.coverId = (await assetsCap.upload(dataUrlToBlob(a.cover), { type: "image/jpeg" })).id; } catch (x) {} }
          if (a.pdf && assetsCap) { try { a.pdfId = (await assetsCap.upload(dataUrlToBlob(a.pdf), { type: "application/pdf" })).id; } catch (x) {} }
          delete a.cover; delete a.pdf;
          a.id = String(a.id).replace(/[^A-Za-z0-9_\-.~:@+]/g, "-");
        }
        await put(a); n++;
      } catch (ex) { skipped++; }
    }
    if (mode === "local") articles = await idbAll();
    toast(n + " artikel dipulihkan" + (skipped ? ", " + skipped + " gagal" : ""));
    route(false);
  });

  function applyModeUI() {
    $('[data-nav="kirim"]').hidden = !canWrite;
    $('[data-nav="naskah"]').hidden = !(mode === "github" && submitUrl);
    $('[data-nav="tinjau"]').hidden = !(mode === "github" && canWrite);
    $('label[for="import-file"]').hidden = !canWrite;
    $("#btn-export").hidden = !canSaveFiles();
    const note = $("#storage-note");
    if (mode === "shared") note.textContent = canWrite
      ? "Artikel tersimpan di server dan langsung terlihat oleh semua pengunjung. Hanya Anda dan editor yang Anda undang yang dapat mengunggah, mengubah, atau menghapus."
      : "Tandeallo memadukan berita dan artikel jurnal. Kutipan APA tersedia di setiap artikel jurnal.";
    else if (mode === "closed") note.textContent = "Masuk ke akun claude.ai untuk membaca artikel.";
    else if (mode === "github") note.textContent = canWrite
      ? "Anda masuk sebagai pengelola. Artikel yang diterbitkan disimpan ke repositori GitHub dan muncul untuk semua pengunjung dalam 1–2 menit."
      : "Tandeallo memadukan berita dan artikel jurnal. Kutipan APA tersedia di setiap artikel jurnal.";
    const adm = $("#btn-admin");
    adm.hidden = mode !== "github";
    adm.textContent = gh ? "Pengelola" : "Masuk pengelola";
  }

  async function loadStatic() {
    try {
      const r = await fetch(CONTENT, { cache: "no-cache" });
      if (!r.ok) return false;
      const data = await r.json();
      articles = Array.isArray(data) ? data : (data.articles || []);
      try {
        const c = await fetch(CONFIG, { cache: "no-cache" });
        if (c.ok) { const url = String((await c.json()).submitUrl || ""); submitUrl = INBOX_URL_RE.test(url) ? url : ""; }
      } catch (e) {}
      return true;
    } catch (e) { return false; }
  }

  /* ================= Boot ================= */
  (async function boot() {
    const c = window.claude;
    if (c && typeof c.use === "function") {
      const use = (n) => Promise.resolve().then(() => c.use(n)).catch(() => null);
      const [dbNs, assetsNs, userNs, dlNs] = await Promise.all([use("db"), use("assets"), use("user"), use("downloads")]);
      dl = dlNs;
      if (dbNs) {
        mode = "shared"; shared = dbNs; assetsCap = assetsNs;
        canWrite = userNs ? await Promise.resolve().then(() => userNs.canEdit()).catch(() => false) : false;
      } else {
        mode = "closed"; canWrite = false; loaded = true;
      }
    }

    if (mode === "shared") {
      applyModeUI();
      loadTimer = setTimeout(() => { if (!loaded) { loadSlow = true; refresh(); } }, 10000);
      shared.collection(COLL).onSnapshot((snap) => {
        articles = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
        if (!snap.metadata.fromCache) { loaded = true; loadSlow = false; clearTimeout(loadTimer); }
        refresh();
      }, () => { loaded = true; loadError = true; clearTimeout(loadTimer); refresh(); });
      route(true);
      return;
    }
    if (mode === "closed") { applyModeUI(); route(true); return; }

    if (/^https?:$/.test(location.protocol) && await loadStatic()) {
      mode = "github"; canWrite = false; loaded = true;
      const saved = lsGet(TOKEN_KEY);
      if (saved) {
        const problem = await ghSignIn(saved);
        if (problem) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} toast("Sesi pengelola berakhir. Masuk lagi untuk mengunggah."); }
      }
      applyModeUI(); route(true);
      return;
    }

    const ok = await idbOpen();
    articles = await idbAll();
    if (!articles.length && !lsGet("tandeallo-seeded")) {
      for (const s of SAMPLES) { try { await idbPut(s); } catch (e) {} }
      articles = await idbAll();
      if (!articles.length) articles = SAMPLES.slice();
      lsSet("tandeallo-seeded", "1");
    }
    loaded = true;
    applyModeUI();
    if (!ok) toast("Penyimpanan browser tidak tersedia; artikel hanya tersimpan sampai halaman ditutup");
    route(true);
  })();
})();
</script>
</body>
</html>
