      toast(adminSeal ? "Masuk dengan token. Atur ulang sandi di halaman Pengelola kalau Anda lupa sandi." : "Masuk. Atur sandi tetap di halaman Pengelola.");
      if (adminSeal) location.hash = "kirim"; else renderLogin(); // already on #masuk: re-render to show the password form
    });
  }

  /* ================= Router ================= */
  function route(scroll) {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h.startsWith("artikel-")) renderArticle(h.slice(8));
    else if (h.startsWith("ubah-")) renderForm(h.slice(5));
    else if (h === "kirim") renderForm(null);
    else if (h === "masuk") renderLogin();
    else if (h === "kirim-naskah") renderForm(null, { submission: true });
    else if (h === "tinjau") renderReview();
    else renderHome(); // also old #berita / #jurnal links
    if (scroll) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => route(true));

  // Re-render after live data changes without disturbing what the reader is doing.
  function refresh() {
    const h = location.hash.replace(/^#/, "");
    if (h === "kirim" || h === "kirim-naskah" || h === "tinjau" || h.startsWith("ubah-")) {
      if (!$("#f")) route(false); // the form was waiting for data
      return;
    }
    if (h.startsWith("artikel-")) {
      const a = articles.find(x => x.id === decodeURIComponent(h.slice(8)));
      if (a && JSON.stringify(a) === lastArticleJSON) return;
      route(false); return;
    }
    if (document.activeElement && document.activeElement.id === "q") { renderFeed(); return; }
    route(false);
  }

  /* ================= Backup ================= */
  function backupJSON() { return JSON.stringify({ app: "tandeallo", version: 1, exported: new Date().toISOString(), articles }, null, 2); }
  $("#btn-export").addEventListener("click", () => {
    saveFile("muara-kata-cadangan-" + new Date().toISOString().slice(0, 10) + ".json", new Blob([backupJSON()], { type: "application/json" }));
  });
  $("#btn-copy-backup").addEventListener("click", () => copyText(backupJSON()));
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0]; if (!file) return;
    e.target.value = "";
    let list;
    try {
      const data = JSON.parse(await file.text());
      list = Array.isArray(data) ? data : data.articles;
      if (!Array.isArray(list)) throw new Error("format");
    } catch (ex) { toast("Berkas cadangan tidak dikenali"); return; }
    toast("Memulihkan " + list.length + " artikel…");
    let n = 0, skipped = 0;
    if (mode === "github") {
      const recs = [];
      for (const raw of list) {
        if (!raw || !raw.id || !raw.title) continue;
        const a = Object.assign({}, raw);
        try {
          const stamp = Date.now().toString(36);
          if (a.cover) { const p = FILES_DIR + a.id + "-" + stamp + "-sampul.jpg"; await ghPutFile(p, a.cover.split(",")[1], "Impor sampul " + a.id); a.coverPath = p; }
          if (a.pdf) { const p = FILES_DIR + a.id + "-" + stamp + ".pdf"; await ghPutFile(p, a.pdf.split(",")[1], "Impor PDF " + a.id); a.pdfPath = p; }
        } catch (x) { skipped++; }
        delete a.cover; delete a.pdf; delete a.coverId; delete a.pdfId;
        recs.push(a);
      }
      try {
        await ghSaveArticles(cur => { const ids = new Set(recs.map(r => r.id)); return cur.filter(x => !ids.has(x.id)).concat(recs); }, "Impor " + recs.length + " artikel");
        n = recs.length;
      } catch (x) { skipped = recs.length; }
      toast(n + " artikel dipulihkan" + (skipped ? ", " + skipped + " gagal" : ""));
      route(false); return;
    }
    for (const raw of list) {
      if (!raw || !raw.id || !raw.title) continue;
      const a = Object.assign({}, raw);
      try {
        if (mode === "shared") {
          // Local backups embed files as data URLs; move them into asset storage.
          if (a.cover && assetsCap) { try { a.coverId = (await assetsCap.upload(dataUrlToBlob(a.cover), { type: "image/jpeg" })).id; } catch (x) {} }
          if (a.pdf && assetsCap) { try { a.pdfId = (await assetsCap.upload(dataUrlToBlob(a.pdf), { type: "application/pdf" })).id; } catch (x) {} }
          delete a.cover; delete a.pdf;
          a.id = String(a.id).replace(/[^A-Za-z0-9_\-.~:@+]/g, "-");
        }
        await put(a); n++;
      } catch (ex) { skipped++; }
    }
    if (mode === "local") articles = await idbAll();
    toast(n + " artikel dipulihkan" + (skipped ? ", " + skipped + " gagal" : ""));
    route(false);
  });

  function applyModeUI() {
    $('[data-nav="kirim"]').hidden = !canWrite;
    $('[data-nav="naskah"]').hidden = !(mode === "github" && submitUrl);
    $('[data-nav="tinjau"]').hidden = !(mode === "github" && canWrite);
    // Backups are a manager tool on the shared site; on a private copy (local mode) they are the only way to move data.
    const backups = mode === "local" || canWrite;
    $('label[for="import-file"]').hidden = !canWrite;
    $("#btn-export").hidden = !(backups && canSaveFiles());
    $("#btn-copy-backup").hidden = !backups;
    const note = $("#storage-note");
    if (mode === "shared") note.textContent = canWrite
      ? "Artikel tersimpan di server dan langsung terlihat oleh semua pengunjung. Hanya Anda dan editor yang Anda undang yang dapat mengunggah, mengubah, atau menghapus."
      : "Muara Kata: tempat semua cerita bermuara. Cerita, puisi, esai, ide, dan tulisan ilmiah dari banyak penulis, dalam satu tempat.";
    else if (mode === "closed") note.textContent = "Masuk ke akun claude.ai untuk membaca artikel.";
    else if (mode === "local") note.textContent = "Tulisan tersimpan di browser perangkat ini (IndexedDB). Buat cadangan secara berkala, lalu pulihkan di perangkat lain lewat tombol Impor.";
    else if (mode === "github") note.textContent = canWrite
      ? "Anda masuk sebagai pengelola. Tulisan yang diterbitkan disimpan ke repositori GitHub dan muncul untuk semua pengunjung dalam 1–2 menit."
      : "Muara Kata: tempat semua cerita bermuara. Cerita, puisi, esai, ide, dan tulisan ilmiah dari banyak penulis, dalam satu tempat.";
    const adm = $("#btn-admin");
    adm.hidden = mode !== "github";
    adm.textContent = gh && canWrite ? "Pengelola" : signingIn ? "Memeriksa…" : "Masuk pengelola";
  }

  async function loadStatic() {
    try {
      const r = await fetch(CONTENT, { cache: "no-cache" });
      if (!r.ok) return false;
      const data = await r.json();
      articles = Array.isArray(data) ? data : (data.articles || []);
      try {
        const c = await fetch(CONFIG, { cache: "no-cache" });
        if (c.ok) {
          const cfg = await c.json();
          const url = String(cfg.submitUrl || ""); submitUrl = INBOX_URL_RE.test(url) ? url : "";
          const seal = cfg.admin;
          adminSeal = seal && seal.v === 1 && seal.salt && seal.iv && seal.data ? seal : null;
        }
      } catch (e) {}
      return true;
    } catch (e) { return false; }
  }

  /* ================= Boot ================= */
  (async function boot() {
    const c = window.claude;
    if (c && typeof c.use === "function") {
      const use = (n) => Promise.resolve().then(() => c.use(n)).catch(() => null);
      const [dbNs, assetsNs, userNs, dlNs] = await Promise.all([use("db"), use("assets"), use("user"), use("downloads")]);
      dl = dlNs;
      if (dbNs) {
        mode = "shared"; shared = dbNs; assetsCap = assetsNs;
        canWrite = userNs ? await Promise.resolve().then(() => userNs.canEdit()).catch(() => false) : false;
      } else {
        mode = "closed"; canWrite = false; loaded = true;
      }
    }

    if (mode === "shared") {
      applyModeUI();
      loadTimer = setTimeout(() => { if (!loaded) { loadSlow = true; refresh(); } }, 10000);
      shared.collection(COLL).onSnapshot((snap) => {
        articles = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
        if (!snap.metadata.fromCache) { loaded = true; loadSlow = false; clearTimeout(loadTimer); }
        refresh();
      }, () => { loaded = true; loadError = true; clearTimeout(loadTimer); refresh(); });
      route(true);
      return;
    }
    if (mode === "closed") { applyModeUI(); route(true); return; }

    if (/^https?:$/.test(location.protocol) && await loadStatic()) {
      mode = "github"; canWrite = false; loaded = true;
      const saved = lsGet(TOKEN_KEY);
      if (saved) {
        signingIn = ghSignIn(saved).then((problem) => {
          signingIn = null;
          if (problem && ghNetFail) toast("GitHub belum bisa dihubungi. Tulisan tetap bisa dibaca; muat ulang nanti untuk mengelola.");
          else if (problem) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} toast("Sesi pengelola berakhir. Masuk lagi untuk mengunggah."); }
          applyModeUI();
          // Re-render so manager controls appear, unless the reader is typing somewhere.
          const el = document.activeElement;
          if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) route(false);
        });
      }
      applyModeUI(); route(true);
      return;
    }

    const ok = await idbOpen();
    articles = await idbAll();
    if (!articles.length && !lsGet("tandeallo-seeded")) {
      for (const s of SAMPLES) { try { await idbPut(s); } catch (e) {} }
      articles = await idbAll();
      if (!articles.length) articles = SAMPLES.slice();
      lsSet("tandeallo-seeded", "1");
    }
    loaded = true;
    applyModeUI();
    if (!ok) toast("Penyimpanan browser tidak tersedia; artikel hanya tersimpan sampai halaman ditutup");
    route(true);
  })();
})();
</script>
</body>
</html>
